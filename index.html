/* ============================================================
   CHARTS (Chart.js) — theme-aware, with graceful fallback
   ============================================================ */
function chartsAvailable(){ return typeof Chart !== 'undefined'; }
function destroyChart(key){ if(charts[key]){ try{ charts[key].destroy(); }catch(e){} delete charts[key]; } }
function chartUnavailableHtml(){ return `<div class="empty-state">${icon('info',34)}<h4>${t('rp_chart_unavailable')}</h4><p>${t('rp_chart_unavailable_d')}</p></div>`; }
function chartThemeColors(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return {
    text: dark ? '#A9AEC9' : '#5A5F7C',
    grid: dark ? 'rgba(255,255,255,0.07)' : 'rgba(20,24,50,0.06)',
    tooltipBg: dark ? '#262D52' : '#12162C',
    tooltipText: '#EAEBF5',
    cardBorder: dark ? '#171C38' : '#FFFFFF',
  };
}
function chartBaseOptions(showLegend){
  const c = chartThemeColors();
  return {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 700 },
    interaction: { mode:'index', intersect:false },
    plugins: {
      legend: { display: showLegend !== false, position:'bottom', labels:{ color:c.text, font:{size:11.5}, usePointStyle:true, boxWidth:8, padding:14 } },
      tooltip: { backgroundColor:c.tooltipBg, titleColor:c.tooltipText, bodyColor:c.tooltipText, padding:10, cornerRadius:8 },
    },
    scales: {
      x: { grid:{ display:false }, ticks:{ color:c.text, font:{size:11.5} } },
      y: { grid:{ color:c.grid }, ticks:{ color:c.text, font:{size:11}, callback:(v) => (state.settings.currencySymbol||'$')+Number(v).toLocaleString() } },
    },
  };
}
function chartBaseOptionsNoScale(){
  const c = chartThemeColors();
  return {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 700 },
    plugins: {
      legend: { display:true, position:'right', labels:{ color:c.text, font:{size:11.5}, usePointStyle:true, boxWidth:8, padding:12 } },
      tooltip: { backgroundColor:c.tooltipBg, titleColor:c.tooltipText, bodyColor:c.tooltipText, padding:10, cornerRadius:8 },
    },
  };
}
function renderComboChart(canvasId, chartKey, monthlyData){
  destroyChart(chartKey);
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  if(!chartsAvailable()){ canvas.parentElement.innerHTML = chartUnavailableHtml(); return; }
  charts[chartKey] = new Chart(canvas.getContext('2d'), {
    data: {
      labels: monthlyData.map(m => monthLabel(m.month)),
      datasets: [
        { type:'bar', label:t('rp_col_income'), data: monthlyData.map(m=>m.income), backgroundColor:'#1E9A6C', borderRadius:6, barPercentage:0.55, categoryPercentage:0.7 },
        { type:'bar', label:t('rp_col_expenses'), data: monthlyData.map(m=>m.expenses), backgroundColor:'#DE5252', borderRadius:6, barPercentage:0.55, categoryPercentage:0.7 },
        { type:'line', label:t('rp_col_net'), data: monthlyData.map(m=>m.net), borderColor:'#C4842A', backgroundColor:'#C4842A', tension:0.35, pointRadius:3, pointBackgroundColor:'#C4842A' },
      ]
    },
    options: chartBaseOptions(true)
  });
}
function renderCashflowChart(monthlyData){ renderComboChart('chartCashflow','cashflow',monthlyData); }
function renderIncomeExpenseChart(monthlyData){ renderComboChart('chartIncomeExpense','incomeExpense',monthlyData); }

function renderCategoryPieChart(catTotals){
  destroyChart('categoryPie');
  const canvas = document.getElementById('chartCategoryPie');
  if(!canvas) return;
  const keys = Object.keys(catTotals);
  if(!keys.length){ document.getElementById('categoryPieBox').innerHTML = `<div class="empty-state">${icon('reports',34)}<h4>${t('rp_no_spending')}</h4><p>${t('rp_no_spending_d')}</p></div>`; return; }
  if(!chartsAvailable()){ canvas.parentElement.innerHTML = chartUnavailableHtml(); return; }
  const c = chartThemeColors();
  const palette = ['#1E9A6C','#DE5252','#C4842A','#6B5FCB','#3B4370','#8B8FAD'];
  const labels = keys.map(tc);
  charts.categoryPie = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data: keys.map(l=>catTotals[l]), backgroundColor: keys.map((_,i)=>palette[i%palette.length]), borderWidth:2, borderColor:c.cardBorder }] },
    options: Object.assign(chartBaseOptionsNoScale(), { cutout:'62%' })
  });
}
function renderAllocationChart(rows){
  destroyChart('allocation');
  const canvas = document.getElementById('chartAllocation');
  if(!canvas) return;
  if(!chartsAvailable()){ canvas.parentElement.innerHTML = chartUnavailableHtml(); return; }
  const c = chartThemeColors();
  const byType = {};
  rows.forEach(r => { byType[r.type] = (byType[r.type]||0) + r.currentValue; });
  const keys = Object.keys(byType);
  const palette = ['#6B5FCB','#1E9A6C','#C4842A','#DE5252','#3B4370','#8B8FAD'];
  const labels = keys.map(tc);
  charts.allocation = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data: keys.map(l=>byType[l]), backgroundColor: keys.map((_,i)=>palette[i%palette.length]), borderWidth:2, borderColor:c.cardBorder }] },
    options: Object.assign(chartBaseOptionsNoScale(), { cutout:'58%' })
  });
}
function renderNetworthChart(){
  destroyChart('networth');
  const canvas = document.getElementById('chartNetworth');
  if(!canvas) return;
  if(!chartsAvailable()){ canvas.parentElement.innerHTML = chartUnavailableHtml(); return; }
  const series = getNetWorthSeries();
  const c = chartThemeColors();
  charts.networth = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels: series.map(s=>monthLabel(s.month)), datasets:[{ label:t('d_net_worth'), data: series.map(s=>s.value), borderColor:'#C4842A', backgroundColor:'rgba(196,132,42,0.14)', fill:true, tension:0.35, pointRadius:3, pointBackgroundColor:'#C4842A' }] },
    options: {
      responsive:true, maintainAspectRatio:false, animation:{ duration:700 },
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:c.tooltipBg, titleColor:c.tooltipText, bodyColor:c.tooltipText, padding:10, cornerRadius:8 } },
      scales:{ x:{ grid:{display:false}, ticks:{color:c.text, font:{size:11.5}} }, y:{ grid:{color:c.grid}, ticks:{color:c.text, font:{size:11}, callback:(v)=>(state.settings.currencySymbol||'$')+Number(v).toLocaleString()} } }
    }
  });
}
</script>
<script>
/* ============================================================
   LEDGER MUTATION HELPER
   ============================================================ */
function applyTransactionToAccount(tx, sign){
  if(!tx.accountId) return;
  const acc = getAccount(tx.accountId);
  if(!acc) return;
  let delta;
  if(acc.type === 'Credit Card'){
    delta = (tx.type === 'expense' ? tx.amount : -tx.amount) * sign;
  } else {
    delta = (tx.type === 'income' ? tx.amount : -tx.amount) * sign;
  }
  acc.balance += delta;
  if(sign > 0 && (!acc.lastTransactionDate || tx.date > acc.lastTransactionDate)) acc.lastTransactionDate = tx.date;
}

/* ============================================================
   CRUD: TRANSACTIONS (income / expense)
   ============================================================ */
function txFieldsFor(type){
  const isExpense = type === 'expense';
  const fields = [
    { name:'date', label:t('f_date'), type:'date', required:true, half:true, default: todayISO() },
    { name:'recurring', label:t('f_recurring'), type:'select', options: ['No'].concat(RECUR_FREQ).map(v=>({value:v,label:tc(v)})), half:true, default:'No' },
    { name:'category', label:t('f_category'), type:'select', required:true, half:true, options: (isExpense ? Object.keys(EXPENSE_CATEGORIES) : INCOME_CATEGORIES).map(v=>({value:v,label:tc(v)})) },
  ];
  if(isExpense) fields.push({ name:'subcategory', label:t('f_subcategory'), type:'select', half:true, dependsOn:'category', optionsFor:(cat)=>(EXPENSE_CATEGORIES[cat]||[]).map(v=>({value:v,label:tc(v)})) });
  fields.push({ name:'merchant', label: isExpense ? t('f_merchant') : t('f_source'), type:'text', required:true, half:true, placeholder: isExpense ? 'e.g. Starbucks' : 'e.g. Salary Deposit' });
  fields.push({ name:'amount', label:t('f_amount'), type:'number', required:true, half:true });
  fields.push({ name:'accountId', label:t('f_account'), type:'select', required:true, half:true, options: state.accounts.map(a => ({ value:a.id, label:a.name })) });
  if(isExpense){
    fields.push({ name:'paymentMethod', label:t('f_payment_method'), type:'select', half:true, options:['Cash','Debit Card','Credit Card','Bank Transfer','E-Wallet'].map(v=>({value:v,label:tc(v)})) });
    fields.push({ name:'needWant', label:t('f_need_want'), type:'select', half:true, options: NEED_WANT.map(v=>({value:v,label:tc(v)})) });
  }
  fields.push({ name:'notes', label:t('f_notes'), type:'textarea', placeholder:t('f_notes_ph') });
  if(isExpense) fields.push({ name:'receipt', label:t('f_receipt'), type:'text', placeholder:t('f_receipt_ph') });
  return fields;
}
function openTransactionForm(type, existing){
  const isEdit = !!(existing && existing.id);
  const typeLabel = type === 'income' ? t('tx_add_income') : t('tx_add_expense');
  openFormModal({
    title: isEdit ? (t('c_edit')+' — '+(type==='income'?t('n_income'):t('n_expenses'))) : typeLabel,
    wide: type === 'expense',
    submitLabel: isEdit ? t('c_save') : typeLabel,
    fields: txFieldsFor(type),
    initial: existing || { accountId: (state.accounts[0]||{}).id },
    onSubmit: (vals) => {
      if(isEdit){
        applyTransactionToAccount(existing, -1);
        Object.assign(existing, vals, { type });
        applyTransactionToAccount(existing, 1);
      } else {
        const tx = Object.assign({ id:uid(), type, notes:'', receipt:'' }, vals);
        applyTransactionToAccount(tx, 1);
        state.transactions.push(tx);
      }
      persistState();
      closeModal();
      if(type === 'income') renderIncome(); else renderExpenses();
      if(currentPage === 'dashboard') renderDashboard();
      toast('success', isEdit ? t('ts_transaction_updated') : tf('ts_added', { item: type==='income'?t('n_income'):t('n_expenses') }));
    }
  });
}
function openAddIncome(){ openTransactionForm('income'); }
function openAddExpense(){ openTransactionForm('expense'); }
function openEditTransaction(id){
  const tx = state.transactions.find(tx => tx.id === id);
  if(tx) openTransactionForm(tx.type, tx);
}
function confirmDeleteTransaction(id, onDone){
  const tx = state.transactions.find(tx => tx.id === id);
  if(!tx) return;
  openConfirm({
    title:t('cf_delete_tx_title'),
    message: tf('cf_delete_tx_msg', { merchant: tx.merchant, amount: fmtMoney(tx.amount), date: fmtDate(tx.date) }),
    confirmLabel:t('c_delete'), danger:true,
    onConfirm: () => {
      reverseTransactionEffects(tx);
      state.transactions = state.transactions.filter(tx => tx.id !== id);
      persistState();
      if(tx.type === 'income') renderIncome(); else renderExpenses();
      if(currentPage === 'dashboard') renderDashboard();
      if(currentPage === 'debts') renderDebts();
      if(currentPage === 'accounts') renderAccounts();
      if(currentPage === 'networth') renderNetworth();
      toast('success', t('ts_transaction_deleted'));
      if(onDone) onDone();
    }
  });
}

/* ============================================================
   CRUD: ACCOUNTS
   ============================================================ */
function accountFields(){
  return [
    { name:'name', label:t('f_account_name'), type:'text', required:true, half:true, placeholder:'e.g. ABA Bank' },
    { name:'type', label:t('f_account_type'), type:'select', options:ACCOUNT_TYPES.map(v=>({value:v,label:tc(v)})), required:true, half:true },
    { name:'balance', label:t('f_balance_usd'), type:'number', required:true, half:true, hint:t('f_cc_hint') },
    { name:'balanceKHR', label:t('f_balance_khr'), type:'number', half:true, default:0, hint:t('f_khr_hint') },
  ];
}
function openAddAccount(){
  openFormModal({ title:t('ac_add'), submitLabel:t('ac_add'), fields:accountFields(), initial:{ type:'Bank' },
    onSubmit:(vals) => { state.accounts.push(Object.assign({ id:uid(), lastTransactionDate:'' }, vals)); persistState(); closeModal(); renderAccounts(); toast('success', tf('ts_added', { item: vals.name })); } });
}
function openEditAccount(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;
  openFormModal({ title:t('c_edit')+' — '+acc.name, submitLabel:t('c_save'), fields:accountFields(), initial:acc,
    onSubmit:(vals) => { Object.assign(acc, vals); persistState(); closeModal(); renderAccounts(); if(currentPage==='dashboard') renderDashboard(); toast('success', tf('ts_updated', { item: acc.name })); } });
}
function confirmDeleteAccount(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;
  openConfirm({
    title:t('cf_delete_account_title'),
    message: tf('cf_delete_acct_msg', { name: acc.name }),
    confirmLabel:t('c_delete'), danger:true,
    onConfirm: () => { state.accounts = state.accounts.filter(a => a.id !== id); persistState(); renderAccounts(); if(currentPage==='dashboard') renderDashboard(); toast('success', tf('ts_deleted', { item: acc.name })); }
  });
}

/* ============================================================
   CRUD: BUDGETS
   ============================================================ */
function openAddBudget(){
  const used = state.budgets.map(b => b.category);
  const available = Object.keys(EXPENSE_CATEGORIES).filter(c => !used.includes(c));

/* ============================================================
   EXPORT (CSV / JSON backup)
   ============================================================ */
function toCSVValue(v){
  if(v === undefined || v === null) return '';
  const s = String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadBlob(content, mime, filename){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportTransactionsCSV(scope){
  let rows, filename;
  if(scope === 'all'){ rows = state.transactions.slice().sort((a,b) => a.date.localeCompare(b.date)); filename = 'cashline-all-transactions.csv'; }
  else { rows = filteredTransactions(scope); filename = 'cashline-' + scope + '.csv'; }
  const headers = [t('tx_col_date'), t('csv_type'), t('tx_col_category'), t('csv_subcategory'), t('csv_merchant_source'), t('tx_col_amount'), t('tx_col_account'), t('tx_col_needwant'), t('f_payment_method'), t('f_recurring'), t('f_notes')];
  const lines = [headers.join(',')];
  rows.forEach(tx => {
    const acc = getAccount(tx.accountId);
    lines.push([tx.date, (tx.type==='income'?t('rc_income_tag'):t('rc_expense_tag')), tc(tx.category), tc(tx.subcategory)||'', tx.merchant, tx.amount, acc?acc.name:'', tc(tx.needWant)||'', tc(tx.paymentMethod)||'', tc(tx.recurring)||'', tx.notes||''].map(toCSVValue).join(','));
  });
  downloadBlob(lines.join('\n'), 'text/csv;charset=utf-8;', filename);
  toast('success', tf('ts_csv_exported', { n: rows.length }));
}
function exportBackup(){
  downloadBlob(JSON.stringify(exportableState(), null, 2), 'application/json', 'cashline-backup.json');
  toast('success', t('ts_backup_exported'));

/* what leaves the app in a backup: all data, but never the login details */
function exportableState(){
  const copy = JSON.parse(JSON.stringify(state));
  if(copy.settings) delete copy.settings.security;
  delete copy.lastImport;
  (copy.transactions || []).forEach(x => { delete x.importBatch; delete x.importSig; });
  return copy;
}
/* what comes in from a backup: the data replaces yours, your own login and Drive link stay exactly as they are */
function adoptImportedState(parsed){
  const keepSecurity = state.settings.security, keepClientId = state.settings.googleClientId, keepFileId = state.settings.googleDriveFileId;
  state = parsed;
  if(!state.settings || typeof state.settings !== 'object') state.settings = {};
  state.settings.security = keepSecurity;
  state.settings.googleClientId = keepClientId;
  state.settings.googleDriveFileId = keepFileId;
  state.lastImport = null;
  normalizeState();
}

/* ---------------- Google Drive backup ---------------- */
var gDriveTokenClient = null;
var gDriveAccessToken = null;
function loadGoogleIdentityScript(cb){
  if(window.google && window.google.accounts && window.google.accounts.oauth2){ cb(); return; }
  const existing = document.getElementById('gsiScript');
  if(existing){ existing.addEventListener('load', cb, { once:true }); return; }
  const s = document.createElement('script');
  s.id = 'gsiScript';
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = cb;
  s.onerror = () => toast('error', t('gd_load_failed'));
  document.head.appendChild(s);
}
function saveGoogleClientId(){
  const el = document.getElementById('gdClientId');
  if(!el) return;
  state.settings.googleClientId = el.value.trim();
  persistState();
  toast('success', t('st_saved'));
  renderSettings();
}
function connectGoogleDrive(){
  const clientId = state.settings.googleClientId;
  if(!clientId){ toast('error', t('gd_no_client_id')); return; }
  loadGoogleIdentityScript(() => {
    try{
      gDriveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          if(!resp || resp.error){ toast('error', t('gd_auth_failed')); return; }
          gDriveAccessToken = resp.access_token;
          toast('success', t('gd_connected'));
          renderSettings();
        },
      });
      gDriveTokenClient.requestAccessToken();
    }catch(e){ toast('error', t('gd_auth_failed')); }
  });
}
function disconnectGoogleDrive(){
  gDriveAccessToken = null;
  renderSettings();
}
async function backupToGoogleDrive(silent){
  if(!gDriveAccessToken){ if(!silent) toast('error', t('gd_not_connected')); return; }
  try{
    let res, fileId = state.settings.googleDriveFileId;
    if(fileId){
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media', {
        method:'PATCH',
        headers:{ 'Authorization':'Bearer '+gDriveAccessToken, 'Content-Type':'application/json' },
        body: JSON.stringify(exportableState()),
      });
      if(res.status === 404){ state.settings.googleDriveFileId = ''; fileId = ''; }
    }
    if(!fileId){
      const metadata = { name:'cashline-backup.json', mimeType:'application/json' };
      const boundary = 'cashlineBoundary'+Date.now();
      const body =
        '--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(metadata)+'\r\n'+
        '--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(exportableState())+'\r\n'+
        '--'+boundary+'--';
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{ 'Authorization':'Bearer '+gDriveAccessToken, 'Content-Type':'multipart/related; boundary='+boundary },
        body,
      });
      if(res.ok){
        const data = await res.json();
        state.settings.googleDriveFileId = data.id;
        try{ await storageSet(STORAGE_KEY, JSON.stringify(state)); }catch(e2){}
      }
    }
    if(!res || !res.ok) throw new Error('HTTP '+(res?res.status:'?'));
    if(!silent) toast('success', t('gd_backup_success'));
  }catch(e){
    if(!silent) toast('error', t('gd_backup_failed'));
    else console.error('Cashline: auto-backup to Drive failed', e);
  }
}
async function openRestoreFromDrive(){
  if(!gDriveAccessToken){ toast('error', t('gd_not_connected')); return; }
  openModalRaw(`
    <div class="modal-head"><div><h3 class="modal-title">${t('gd_restore')}</h3></div><button class="modal-close" onclick="closeModal()" aria-label="Close">${icon('x',15)}</button></div>
    <div class="modal-body" id="gdRestoreList"><p class="text-muted" style="text-align:center; padding:20px 0;">${t('gd_restoring')}</p></div>
  `);
  try{
    const q = encodeURIComponent("name contains 'cashline-backup' and trashed = false");
    const res = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc', {
      headers:{ 'Authorization':'Bearer '+gDriveAccessToken },
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const files = data.files || [];
    const list = document.getElementById('gdRestoreList');
    if(!list) return;
    if(!files.length){ list.innerHTML = `<p class="text-muted" style="text-align:center; padding:20px 0;">${t('gd_no_backups')}</p>`; return; }
    list.innerHTML = files.map(f => `
      <div class="mini-row" style="cursor:pointer;" onclick="restoreFromDriveFile('${f.id}')">
        <div class="mini-row-left"><div class="mini-icon">${icon('cloud',15)}</div><div><div class="mini-name">${escapeHtml(f.name)}</div><div class="mini-sub">${fmtDate((f.modifiedTime||'').slice(0,10))}</div></div></div>
        ${icon('chevronRight',15)}
      </div>`).join('');
  }catch(e){
    const list = document.getElementById('gdRestoreList');
    if(list) list.innerHTML = `<p class="text-muted" style="text-align:center; padding:20px 0;">${t('gd_backup_failed')}</p>`;
  }
}
function restoreFromDriveFile(fileId){
  openConfirm({ title:t('gd_restore'), message:t('gd_restore_confirm'), confirmLabel:t('gd_restore'), danger:true,
    onConfirm: async () => {
      try{
        const res = await fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media', { headers:{ 'Authorization':'Bearer '+gDriveAccessToken } });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const parsed = await res.json();
        if(!parsed || !Array.isArray(parsed.transactions) || !Array.isArray(parsed.accounts)) throw new Error('bad format');
        adoptImportedState(parsed);
        state.settings.googleDriveFileId = fileId;
        persistState();
        renderSidebar(); renderCurrentPage();
        toast('success', t('gd_restored'));
      }catch(e){ toast('error', t('gd_backup_failed')); }
    }
  });
}

function activityTimeLabel(iso){
  const then = new Date(iso).getTime();
  if(isNaN(then)) return '—';
  const diffSec = Math.max(0, Math.round((Date.now() - then) / 1000));
  if(diffSec < 60) return t('act_just_now');
  const diffMin = Math.round(diffSec / 60);
  if(diffMin < 60) return tf('act_minutes_ago', { n: diffMin });
  const diffHr = Math.round(diffMin / 60);
  if(diffHr < 24) return tf('act_hours_ago', { n: diffHr });
  const diffDay = Math.round(diffHr / 24);
  if(diffDay < 7) return tf('act_days_ago', { n: diffDay });
  const d = new Date(iso);
  return d.toLocaleDateString(currentLocale(), { month:'short', day:'numeric', year:'numeric' })+' '+d.toLocaleTimeString(currentLocale(), { hour:'numeric', minute:'2-digit' });
}

async function saveSecurityUser(id){
  const sec = state.settings.security;
  const u = (sec.users||[]).find(x => x.id === id);
  if(!u) return;
  const nameEl = document.querySelector('.userNameInput[data-uid="'+id+'"]');
  const userEl = document.querySelector('.userUsernameInput[data-uid="'+id+'"]');
  const pwEl = document.querySelector('.userPasswordInput[data-uid="'+id+'"]');
  const name = nameEl ? nameEl.value.trim() : u.name;
  const uname = normUser(userEl ? userEl.value : u.username);
  const pw = pwEl ? pwEl.value : '';
  if(!uname){ toast('error', t('sec_user_need_username')); return; }
  if(!validUsername(uname)){ toast('error', t('su_username_invalid')); return; }
  if(usernameTaken(uname, id)){ toast('error', t('acct_username_taken')); return; }
  if(!u.hash && !pw){ toast('error', t('sec_user_need_password')); return; }
  if(pw && pw.length < 6){ toast('error', t('su_pw_short')); return; }
  const isNewUser = !u.hash;
  const pages = [...document.querySelectorAll('.userPermView[data-uid="'+id+'"]')].filter(cb => cb.checked).map(cb => cb.dataset.page);
  const editPages = [...document.querySelectorAll('.userPermEdit[data-uid="'+id+'"]')].filter(cb => cb.checked).map(cb => cb.dataset.page);
  if(pw){ const cred = await makeCredential(uname, pw); u.salt = cred.salt; u.iterations = cred.iterations; u.hash = cred.hash; }
  u.username = uname;
  u.name = name || uname;
  u.pages = pages;
  u.editPages = editPages;
  delete u.pin;
  logActivity(isNewUser ? 'act_user_added' : 'act_user_updated', u.name);
  await persistState();
  toast('success', t('sec_user_saved'));
  renderSettings();
}

/* ============================================================
   CSV IMPORT (bank / card statement -> transactions)
   ============================================================ */
function splitCsvLine(line, d){
  const out = []; let field = '', inQ = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(inQ){ if(c === '"'){ if(line[i+1] === '"'){ field += '"'; i++; } else inQ = false; } else field += c; }
    else if(c === '"') inQ = true;
    else if(c === d){ out.push(field); field = ''; }
    else field += c;
  }
  out.push(field);
  return out;
}
function detectDelimiter(text){
  const lines = String(text == null ? '' : text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() !== '').slice(0, 12);
  let best = ',', bestScore = -1;
  for(const d of [',', ';', '\t']){
    const counts = lines.map(l => splitCsvLine(l, d).length);
    const tally = {};
    counts.forEach(n => { tally[n] = (tally[n] || 0) + 1; });
    let modal = 1, modalLines = 0;
    Object.keys(tally).forEach(k => { if(tally[k] > modalLines || (tally[k] === modalLines && Number(k) > modal)){ modal = Number(k); modalLines = tally[k]; } });
    if(modal < 2 || !lines.length) continue;                       // this candidate does not split the file into columns
    const score = (modalLines / lines.length) * 1000 + modal;      // consistency first, then more columns
    if(score > bestScore){ bestScore = score; best = d; }
  }
  return best;
}
function parseCSV(text, delim){
  text = String(text == null ? '' : text).replace(/^\uFEFF/, '');   // drop a byte-order mark if the file has one
  const D = delim || detectDelimiter(text);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }   // an escaped quote inside a quoted field
        else inQuotes = false;
      } else field += c;
    } else if(c === '"'){ inQuotes = true; }
    else if(c === D){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else if(c === '\r'){ /* handled by the \n that follows; a lone \r is ignored */ }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }   // last line without a trailing newline
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));      // drop blank lines
}
function pad2(n){ return String(n).padStart(2, '0'); }
function parseDateWithFormat(str, format){
  str = String(str == null ? '' : str).trim();
  str = str.replace(/[ T]\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?\s*(?:[ap]m)?\s*(?:Z|[+-]\d{2}:?\d{2})?$/i, '');   // drop a trailing time of day
  if(!str) return '';
  const parts = str.split(/[\/\-.]/).map(s => s.trim());
  if(parts.length === 3 && parts.every(p => /^\d+$/.test(p))){
    let y, mo, d;
    if(parts[0].length === 4 || format === 'ymd'){ y = parts[0]; mo = parts[1]; d = parts[2]; }
    else if(format === 'dmy'){ d = parts[0]; mo = parts[1]; y = parts[2]; }
    else { mo = parts[0]; d = parts[1]; y = parts[2]; }
    if(y.length === 2) y = (Number(y) > 70 ? '19' : '20') + y;
    const mi = Number(mo), di = Number(d), yi = Number(y);
    if(mi >= 1 && mi <= 12 && di >= 1 && di <= 31 && yi >= 1900 && yi <= 2200){
      const probe = new Date(yi, mi - 1, di);   // rejects impossible dates such as 31 February
      if(probe.getFullYear() === yi && probe.getMonth() === mi - 1 && probe.getDate() === di) return y + '-' + pad2(mi) + '-' + pad2(di);
    }
    return '';
  }
  const dt = new Date(str);   // forms such as "Jan 5, 2026"
  if(!isNaN(dt.getTime())) return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
  return '';
}
function parseFlexibleAmount(str){
  if(str === undefined || str === null) return NaN;
  str = String(str).trim();
  if(!str) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(str)){ neg = true; str = str.slice(1, -1); }          // (50.00) means -50.00
  if(/^[^0-9]*-/.test(str) || /-\s*$/.test(str) || /\bdr\b/i.test(str)) neg = true;   // leading or trailing minus, or a DR (debit) marker
  let core = str.replace(/[^0-9.,]/g, '');                                  // strip currency symbols, spaces and letters
  const lastComma = core.lastIndexOf(',');
  if(lastComma >= 0 && /^\d{1,2}$/.test(core.slice(lastComma + 1))){        // decimal comma: 50,25 or 1.234,50
    core = core.slice(0, lastComma).replace(/[.,]/g, '') + '.' + core.slice(lastComma + 1);
  } else {
    core = core.replace(/,/g, '');                                          // otherwise commas are thousands separators
  }
  const n = parseFloat(core);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}

function buildCsvTransactions(){
  if(!csvImportState) return [];
  const val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const chk = (id) => { const el = document.getElementById(id); return !!(el && el.checked); };
  const dateCol = parseInt(val('ciDateCol'), 10), descCol = parseInt(val('ciDescCol'), 10);
  const dateFormat = val('ciDateFormat'), accountId = val('ciAccount'), defaultCategory = val('ciDefaultCategory') || 'Other';
  const separate = chk('ciSeparateCols'), flip = chk('ciFlipSign'), isKhr = val('ciCurrency') === 'KHR';
  const amountCol = parseInt(val('ciAmountCol'), 10), debitCol = parseInt(val('ciDebitCol'), 10), creditCol = parseInt(val('ciCreditCol'), 10);
  return csvImportState.rows.map((row, idx) => {
    const date = parseDateWithFormat(row[dateCol], dateFormat);
    const merchant = String(row[descCol] == null ? '' : row[descCol]).trim();
    let signed;
    if(separate){
      const debit = parseFlexibleAmount(row[debitCol]), credit = parseFlexibleAmount(row[creditCol]);
      if(!isNaN(credit) && credit !== 0) signed = Math.abs(credit);
      else if(!isNaN(debit) && debit !== 0) signed = -Math.abs(debit);
      else signed = NaN;
    } else {
      signed = parseFlexibleAmount(row[amountCol]);
      if(flip && !isNaN(signed)) signed = -signed;
    }
    const original = isNaN(signed) ? NaN : Math.abs(signed);
    const usd = isNaN(original) ? NaN : (isKhr ? Math.round(khrToUsd(original) * 100) / 100 : original);
    const valid = !!date && !!merchant && !isNaN(signed) && signed !== 0 && usd > 0;
    const amount = valid ? usd : NaN;
    const type = valid && signed > 0 ? 'income' : 'expense';
    const isDup = valid && state.transactions.some(x => x.accountId === accountId && x.date === date && Math.abs(x.amount - amount) < 0.005 && String(x.merchant || '').trim().toLowerCase() === merchant.toLowerCase());
    return { idx, date, merchant, amount, original: valid ? original : NaN, isKhr, type, category: type === 'income' ? 'Other' : defaultCategory, accountId, valid, isDup };
  });
}

async function commitCsvImport(){
  const btn = document.getElementById('ciImportBtn');
  if(btn) btn.disabled = true;
  const skipCb = document.getElementById('ciSkipDupes');
  const skipDupes = skipCb ? skipCb.checked : true;
  const rows = buildCsvTransactions().filter(r => r.valid && !(skipDupes && r.isDup));
  if(!rows.length){ toast('error', t('ci_nothing_to_import')); if(btn) btn.disabled = false; return; }
  const note = t('ci_imported_note');
  const batch = 'imp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.transactions.forEach(x => { delete x.importBatch; delete x.importSig; });   // only the latest import stays undoable
  rows.forEach(r => {
    const tx = { id: uid(), type: r.type, date: r.date, category: r.category, subcategory: r.type === 'expense' ? 'Imported' : '', merchant: r.merchant, amount: r.amount, accountId: r.accountId, paymentMethod: '', needWant: 'Need', recurring: 'No', notes: r.isKhr ? note + ' (' + fmtKHR(r.original) + ')' : note, receipt: '' };
    tx.importBatch = batch; tx.importSig = importSignature(tx);
    applyTransactionToAccount(tx, 1);
    state.transactions.push(tx);
  });
  state.lastImport = { batch, count: rows.length, at: new Date().toISOString() };
  logActivity('act_csv_import', String(rows.length));
  await persistState();
  closeModal();
  renderSidebar();
  renderCurrentPage();
  toast('success', tf('ci_import_success', { n: rows.length }));
}

/* fingerprint of the fields an import sets, so Undo can tell an untouched imported row from one the user has since edited */
function importSignature(tx){
  const s = [tx.date, Number(tx.amount).toFixed(2), tx.merchant, tx.accountId, tx.category, tx.subcategory, tx.type, tx.notes, tx.paymentMethod, tx.needWant, tx.recurring].join('\u0001');
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
function lastImportRemaining(){
  const li = state.lastImport;
  if(!li || !li.batch) return 0;
  return state.transactions.filter(x => x.importBatch === li.batch).length;
}
function confirmUndoLastImport(){
  const n = lastImportRemaining();
  if(!n) return;
  openConfirm({ title: t('ci_undo_title'), message: tf('ci_undo_msg', { n }), confirmLabel: t('ci_undo_confirm'), danger: true,
    onConfirm: async () => {
      const batch = state.lastImport && state.lastImport.batch;
      if(!batch) return;
      let removed = 0, kept = 0;
      state.transactions = state.transactions.filter(tx => {
        if(tx.importBatch !== batch) return true;
        if(importSignature(tx) !== tx.importSig){ kept++; return true; }   // edited since the import: leave it alone
        applyTransactionToAccount(tx, -1);
        removed++;
        return false;
      });
      state.transactions.forEach(tx => { if(tx.importBatch === batch){ delete tx.importBatch; delete tx.importSig; } });   // the kept rows are now the user's own
      state.lastImport = null;
      logActivity('act_csv_undo', String(removed));
      await persistState();
      renderSidebar();
      renderCurrentPage();
      toast('success', kept ? tf('ci_undo_done_kept', { n: removed, k: kept }) : tf('ci_undo_done', { n: removed }));
    } });
}

function resizeImageToDataUrl(file, maxDim, onDone, onError){
  if(!file || !file.type || !file.type.startsWith('image/')){ onError(); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try{ onDone(canvas.toDataURL('image/png')); }catch(err){ onError(); }
    };
    img.onerror = onError;
    img.src = e.target.result;
  };
  reader.onerror = onError;
  reader.readAsDataURL(file);
}

/* ---- credential helpers ---- */
function normUser(s){ return String(s == null ? '' : s).trim().toLowerCase(); }
function validUsername(u){ return /^[a-z0-9._-]{3,32}$/.test(u); }
function usernameTaken(u, exceptId){
  const sec = state.settings.security;
  if(sec.owner && sec.owner.username === u && exceptId !== 'owner') return true;
  return (sec.users || []).some(x => x.username === u && x.id !== exceptId);
}
function makeUsernameFromName(name, taken){
  let base = normUser(name).replace(/[^a-z0-9._-]/g, '');
  if(base.length < 3) base = (base + 'user');
  base = base.slice(0, 28);
  let candidate = base, n = 2;
  while(taken.has(candidate)){ candidate = base + n; n++; }
  return candidate;
}
async function makeCredential(username, password){
  const salt = randomSaltHex();
  return { username: normUser(username), salt: salt, iterations: AUTH_ITERATIONS, hash: await hashPassword(password, salt, AUTH_ITERATIONS) };
}
async function credentialMatches(cred, password){
  if(!cred || !cred.hash || !cred.salt) return false;
  return (await hashPassword(password, cred.salt, cred.iterations || AUTH_ITERATIONS)) === cred.hash;
}
function passwordProblem(pw, pw2){
  if(pw.length < 6) return 'su_pw_short';
  if(pw !== pw2) return 'su_pw_mismatch';
  return '';
}
async function attemptLogin(uname, pw){
  const sec = state.settings.security;
  if(sec.owner && sec.owner.username === uname){
    return (await credentialMatches(sec.owner, pw)) ? { level:'owner', userId:null } : null;
  }
  const u = (sec.users || []).find(x => x.username === uname && x.hash);
  if(u){
    return (await credentialMatches(u, pw)) ? { level:'viewer', userId:u.id } : null;
  }
  await hashPassword(pw, '00'.repeat(16), AUTH_ITERATIONS);   // same work as a real check, so timing does not reveal which usernames exist
  return null;
}
async function verifyPersisted(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    const a = saved && saved.settings && saved.settings.security && saved.settings.security.owner;
    const b = state.settings.security.owner;
    return !!(a && b && a.hash === b.hash && a.username === b.username);
  }catch(e){ return false; }
}

/* ---- keep saved data valid, and upgrade older saves ---- */
function normalizeState(){
  ['accounts','transactions','budgets','goals','debts','lendings','investments','assets','recurring','challenges','netWorthHistory'].forEach(k => {
    if(!Array.isArray(state[k])) state[k] = [];
  });
  if(!state.settings || typeof state.settings !== 'object') state.settings = {};
  const s = state.settings;
  if(!s.theme) s.theme = 'light';
  if(!s.currencySymbol) s.currencySymbol = '$';
  if(!s.khrPerUsd) s.khrPerUsd = 4100;
  if(!LANGS.includes(s.lang)) s.lang = 'en';
  if(s.customLogo === undefined) s.customLogo = '';
  if(typeof s.appName !== 'string') s.appName = '';
  if(s.googleClientId === undefined) s.googleClientId = '';
  if(s.googleDriveFileId === undefined) s.googleDriveFileId = '';
  if(!s.security || typeof s.security !== 'object') s.security = {};
  const sec = s.security;
  if(!Array.isArray(sec.users)){
    sec.users = [];
    if(sec.viewerPin){   // the very first two-tier version: one view-only PIN becomes a named user
      sec.users.push({ id: uid(), name: 'Viewer', pin: sec.viewerPin,
        pages: Array.isArray(sec.viewerPages) ? sec.viewerPages.slice() : VIEWER_ALL_PAGES.slice(),
        editPages: Array.isArray(sec.viewerEditPages) ? sec.viewerEditPages.slice() : [] });
    }
  }
  sec.users = sec.users.filter(u => u && typeof u === 'object');
  sec.users.forEach(u => {
    if(!u.id) u.id = uid();
    if(!Array.isArray(u.pages)) u.pages = [];
    if(!Array.isArray(u.editPages)) u.editPages = [];
    if(typeof u.profilePic !== 'string') u.profilePic = '';
  });
  delete sec.viewerPin; delete sec.viewerPages; delete sec.viewerEditPages; delete sec.enabled;
  if(typeof sec.lastUsername !== 'string') sec.lastUsername = '';
  if(typeof sec.rememberUsername !== 'boolean') sec.rememberUsername = true;
  if(sec.owner && (typeof sec.owner !== 'object' || !sec.owner.hash || !sec.owner.salt || !sec.owner.username)) sec.owner = null;
  if(sec.owner && typeof sec.owner.profilePic !== 'string') sec.owner.profilePic = '';
  if(typeof sec.autoLockMinutes !== 'number') sec.autoLockMinutes = 15;
  if(!Array.isArray(state.activityLog)) state.activityLog = [];
  if(!state.lastImport || typeof state.lastImport !== 'object' || !state.lastImport.batch) state.lastImport = null;
}
async function migrateLegacyCredentials(){
  const sec = state.settings.security;
  const taken = new Set();
  if(sec.owner) taken.add(sec.owner.username);
  sec.users.forEach(u => { if(u.username) taken.add(u.username); });
  let changed = false;
  for(const u of sec.users){
    if(u.hash){ if('pin' in u){ delete u.pin; changed = true; } continue; }
    if(!u.pin) continue;
    try{   // an old PIN user keeps working: the PIN becomes their password, and a username is made from their name
      if(!u.username || !validUsername(u.username)){ u.username = makeUsernameFromName(u.name, taken); taken.add(u.username); }
      u.salt = randomSaltHex(); u.iterations = AUTH_ITERATIONS;
      u.hash = await hashPassword(String(u.pin), u.salt, u.iterations);
      delete u.pin; changed = true;
    }catch(e){ console.error('Cashline: could not upgrade a saved user login', e); }
  }
  return changed;
}

function renderLoginScreen(onUnlock){
  const sec = state.settings.security;
  const overlay = showOverlayContent(`
    <form id="loginForm" autocomplete="on" style="display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:310px; text-align:center; padding:0 22px;">

      ${pwField(`<input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="${escapeHtml(t('lg_password'))}" aria-label="${escapeHtml(t('lg_password'))}" style="width:100%;"/>`)}
      <label style="display:flex; align-items:center; gap:8px; color:#B8BCD0; font-size:12.5px; cursor:pointer;"><input type="checkbox" id="loginRemember" ${sec.rememberUsername ? 'checked' : ''}/> ${t('lg_remember')}</label>
      <div id="loginError" role="alert" style="color:#F29A9A; font-size:12.5px; min-height:16px; line-height:1.4;"></div>
      <button type="submit" class="btn btn-amber" id="loginBtn" style="width:100%;">${t('lg_login_btn')}</button>

  if(!overlay){ onUnlock(); return; }
  const uEl = document.getElementById('loginUsername'), pEl = document.getElementById('loginPassword');
  const rEl = document.getElementById('loginRemember'), errEl = document.getElementById('loginError'), btn = document.getElementById('loginBtn');
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if(btn.disabled) return;
    const uname = normUser(uEl.value), pw = pEl.value;
    if(!uname || !pw){ errEl.textContent = t('lg_bad_creds'); return; }
    btn.disabled = true; btn.textContent = t('lg_checking'); errEl.textContent = '';
    let res = null;
    try{ res = await attemptLogin(uname, pw); }catch(err){ console.error('Cashline: login check failed', err); }
    btn.disabled = false; btn.textContent = t('lg_login_btn');
    if(!res){ errEl.textContent = t('lg_bad_creds'); pEl.value = ''; pEl.focus(); return; }
    accessLevel = res.level; currentUserId = res.userId;
    sec.rememberUsername = !!rEl.checked;
    sec.lastUsername = rEl.checked ? uname : '';
    logActivity('act_login', '');
    persistState();   // remembers the username choice; logging in never depends on this write
    onUnlock();
  });
  setTimeout(() => (uEl.value ? pEl : uEl).focus(), 100);
}
function renderSetupScreen(onDone){
  const mode = storageMode();
  const note = mode === 'device' ? t('st_note_device') : mode === 'none' ? t('st_note_none') : '';
  const overlay = showOverlayContent(`
    <form id="setupForm" autocomplete="on" style="display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:320px; text-align:center; padding:0 22px;">
      ${authBrandHtml()}
      <div style="color:#fff; font-family:var(--font-serif); font-size:21px;">${t('sec_setup_title')}</div>
      <div style="color:#B8BCD0; font-size:13px; line-height:1.5;">${t('su_sub')}</div>
      <input type="text" id="setupUsername" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${escapeHtml(t('lg_username'))}" aria-label="${escapeHtml(t('lg_username'))}" style="width:100%;"/>
      ${pwField(`<input type="password" id="setupPassword" name="new-password" autocomplete="new-password" placeholder="${escapeHtml(t('lg_password'))}" aria-label="${escapeHtml(t('lg_password'))}" style="width:100%;"/>`)}
      ${pwField(`<input type="password" id="setupPassword2" name="confirm-password" autocomplete="new-password" placeholder="${escapeHtml(t('su_confirm'))}" aria-label="${escapeHtml(t('su_confirm'))}" style="width:100%;"/>`)}
      <div id="setupError" role="alert" style="color:#F29A9A; font-size:12.5px; min-height:16px; line-height:1.4;"></div>
      <button type="submit" class="btn btn-amber" id="setupBtn" style="width:100%;">${t('su_btn')}</button>
      ${note ? `<div style="color:${mode === 'none' ? '#F29A9A' : '#8F94AE'}; font-size:11.5px; line-height:1.5;">${note}</div>` : ''}
    </form>`);
  if(!overlay){ onDone(); return; }
  const uEl = document.getElementById('setupUsername'), p1 = document.getElementById('setupPassword'), p2 = document.getElementById('setupPassword2');
  const errEl = document.getElementById('setupError'), btn = document.getElementById('setupBtn');
  document.getElementById('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if(btn.disabled) return;
    const uname = normUser(uEl.value);
    if(!validUsername(uname)){ errEl.textContent = t('su_username_invalid'); uEl.focus(); return; }
    const problem = passwordProblem(p1.value, p2.value);
    if(problem){ errEl.textContent = t(problem); (problem === 'su_pw_short' ? p1 : p2).focus(); return; }
    errEl.textContent = ''; btn.disabled = true;
    const sec = state.settings.security;
    sec.owner = await makeCredential(uname, p1.value);
    sec.lastUsername = uname; sec.rememberUsername = true;
    delete sec.ownerPin;
    const saved = await persistState();
    const verified = saved && await verifyPersisted();
    accessLevel = 'owner'; currentUserId = null;
    logActivity('act_account_created', ''); persistState();
    onDone();
    if(!verified) toast('error', t('su_save_failed_warn'));
  });
  setTimeout(() => uEl.focus(), 100);
}
function renderUpgradeScreen(onDone){
  const overlay = showOverlayContent(`
    <form id="upgradeForm" autocomplete="on" style="display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:320px; text-align:center; padding:0 22px;">
      ${authBrandHtml()}
      <div style="color:#fff; font-family:var(--font-serif); font-size:21px;">${t('up_title')}</div>
      <div style="color:#B8BCD0; font-size:13px; line-height:1.5;">${t('up_sub')}</div>
      ${pwField(`<input type="password" id="upgradePin" name="current-pin" autocomplete="off" inputmode="numeric" placeholder="${escapeHtml(t('up_current_pin'))}" aria-label="${escapeHtml(t('up_current_pin'))}" style="width:100%;"/>`)}
      <input type="text" id="upgradeUsername" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${escapeHtml(t('lg_username'))}" aria-label="${escapeHtml(t('lg_username'))}" style="width:100%;"/>
      ${pwField(`<input type="password" id="upgradePassword" name="new-password" autocomplete="new-password" placeholder="${escapeHtml(t('lg_password'))}" aria-label="${escapeHtml(t('lg_password'))}" style="width:100%;"/>`)}
      ${pwField(`<input type="password" id="upgradePassword2" name="confirm-password" autocomplete="new-password" placeholder="${escapeHtml(t('su_confirm'))}" aria-label="${escapeHtml(t('su_confirm'))}" style="width:100%;"/>`)}
      <div id="upgradeError" role="alert" style="color:#F29A9A; font-size:12.5px; min-height:16px; line-height:1.4;"></div>
      <button type="submit" class="btn btn-amber" id="upgradeBtn" style="width:100%;">${t('up_btn')}</button>
    </form>`);
  if(!overlay){ onDone(); return; }
  const pinEl = document.getElementById('upgradePin'), uEl = document.getElementById('upgradeUsername');
  const p1 = document.getElementById('upgradePassword'), p2 = document.getElementById('upgradePassword2');
  const errEl = document.getElementById('upgradeError'), btn = document.getElementById('upgradeBtn');
  document.getElementById('upgradeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if(btn.disabled) return;
    const sec = state.settings.security;
    if(pinEl.value.trim() !== String(sec.ownerPin)){ errEl.textContent = t('up_bad_pin'); pinEl.value = ''; pinEl.focus(); return; }
    const uname = normUser(uEl.value);
    if(!validUsername(uname)){ errEl.textContent = t('su_username_invalid'); uEl.focus(); return; }
    if(usernameTaken(uname, 'owner')){ errEl.textContent = t('acct_username_taken'); uEl.focus(); return; }
    const problem = passwordProblem(p1.value, p2.value);
    if(problem){ errEl.textContent = t(problem); (problem === 'su_pw_short' ? p1 : p2).focus(); return; }
    errEl.textContent = ''; btn.disabled = true;
    sec.owner = await makeCredential(uname, p1.value);
    sec.lastUsername = uname; sec.rememberUsername = true;
    delete sec.ownerPin;
    const saved = await persistState();
    const verified = saved && await verifyPersisted();
    accessLevel = 'owner'; currentUserId = null;
    logActivity('act_upgraded_login', ''); persistState();
    onDone();
    if(!verified) toast('error', t('su_save_failed_warn'));
  });
  setTimeout(() => pinEl.focus(), 100);
}
function runLoginGate(onDone){
  const sec = state.settings.security;
  if(sec.owner) renderLoginScreen(onDone);
  else if(sec.ownerPin) renderUpgradeScreen(onDone);
  else renderSetupScreen(onDone);
}
function lockNow(){
  if(!state.settings.security.owner) return;
  if(accessLevel){ logActivity('act_logout', ''); persistState(); }
  if(autoLockTimer){ clearTimeout(autoLockTimer); autoLockTimer = null; }
  currentUserId = null;
  document.querySelectorAll('.page').forEach(p => { p.innerHTML = ''; });   // nothing from this session stays on the page while locked
  runLoginGate(() => {
    navigate(currentPage);   // navigate() enforces what the person who just logged in may see
    document.body.classList.toggle('viewer-mode', accessLevel === 'viewer');
    hideBootOverlay();
    resetAutoLockTimer();
  });
}

async function boot(){
  try{
    const loaded = await loadState();
    state = loaded || seedState();
    normalizeState();
    const upgraded = await migrateLegacyCredentials();

    applyTheme(state.settings.theme || 'light');
    document.documentElement.setAttribute('lang', currentLang()==='km'?'km':currentLang()==='zh'?'zh-CN':'en');
    renderLangFlag();
    ensureNetWorthSnapshot();
    if(!loaded || upgraded) await persistState();

    const finishBoot = () => {
      renderSidebar();
      navigate('dashboard');
      refreshNotifBadge();
      translateStaticChrome();
      renderSidebarBrand();
      document.body.classList.toggle('viewer-mode', accessLevel === 'viewer');
      hideBootOverlay();
      resetAutoLockTimer();
    };
    runLoginGate(finishBoot);
  }catch(err){
    console.error('Cashline boot error:', err);
    if(!state) state = seedState();
    try{ normalizeState(); }catch(e0){ /* carry on with what we have */ }
    const recover = () => {
      try{ renderSidebar(); navigate('dashboard'); renderSidebarBrand(); }catch(e2){ /* UI stays minimal */ }
      document.body.classList.toggle('viewer-mode', accessLevel === 'viewer');
      toast('error', t('c_boot_error'));
      hideBootOverlay();
    };
    try{ runLoginGate(recover); }catch(e3){ /* fail closed: the overlay stays up, so the app is never revealed without passing the login gate */ }
  }
}
boot();
initAutoLockWatcher();
</script>
