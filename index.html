<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cashline — Personal Finance</title>
<style>
/* ============================================================
   CASHLINE — DESIGN SYSTEM
   Ink-blue ledger palette · serif numerals · a living pulse line
   ============================================================ */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--text-900);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

:root{
  --ink-950: #0B0E1D;
  --ink-900: #12162C;
  --ink-800: #1B2140;
  --ink-700: #262D52;
  --ink-600: #363E6B;
  --ink-400: #6B72A0;

  --paper: #F1F2F7;
  --surface: #FFFFFF;
  --surface-2: #F7F7FB;

  --amber-500: #C4842A;
  --amber-600: #A56E20;
  --amber-100: #F5E6CC;

  --emerald-600: #1E9A6C;
  --emerald-100: #DBF2E7;

  --coral-500: #DE5252;
  --coral-100: #FBE1E0;

  --violet-500: #6B5FCB;
  --violet-100: #E7E4F8;

  --text-900: #1A1E33;
  --text-600: #5A5F7C;
  --text-400: #8B8FAD;
  --text-on-ink: #E8E9F5;
  --text-on-ink-muted: #9AA0C4;

  --border: #E2E3ED;
  --border-strong: #CBCDDE;

  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(20,24,50,0.06);
  --shadow-md: 0 6px 20px rgba(20,24,50,0.08), 0 1px 3px rgba(20,24,50,0.05);
  --shadow-lg: 0 16px 40px rgba(20,24,50,0.14), 0 2px 8px rgba(20,24,50,0.08);

  --sidebar-w: 254px;
  --topbar-h: 66px;

  --dur-fast: 150ms;
  --dur-med: 260ms;
  --dur-slow: 500ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"]{
  --paper: #0E1224;
  --surface: #171C38;
  --surface-2: #1D2342;
  --text-900: #EAEBF5;
  --text-600: #A9AEC9;
  --text-400: #767CA0;
  --border: #2A3058;
  --border-strong: #3A4173;
  --amber-100: #3B2E17;
  --emerald-100: #113828;
  --coral-100: #3A1C1E;
  --violet-100: #26214A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 20px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

h1,h2,h3,h4 { margin: 0; font-family: var(--font-serif); font-weight: 700; color: var(--text-900); }
p { margin: 0; }
button { font-family: inherit; }
a { color: inherit; }
::selection { background: var(--amber-100); }

/* scrollbars */
.scroll-y{ overflow-y: auto; }
.scroll-y::-webkit-scrollbar{ width: 8px; height: 8px; }
.scroll-y::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 8px; }
.scroll-y::-webkit-scrollbar-track{ background: transparent; }

.tnum{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.sr-only{ position:absolute; width:1px;height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* ============================== APP SHELL ============================== */
.app-shell{ display:flex; height:100vh; width:100vw; }

.sidebar{
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--ink-900);
  color: var(--text-on-ink);
  display:flex; flex-direction:column;
  padding: 20px 14px;
  position: relative;
  z-index: 40;
  transition: transform var(--dur-med) var(--ease);
}
.sidebar-brand{
  display:flex; align-items:center; gap:10px;
  padding: 6px 10px 22px 10px;
}
.brand-mark{ width:30px; height:30px; flex:0 0 30px; color: var(--amber-500); display:flex; align-items:center; justify-content:center; }
.brand-mark svg{ width:100%; height:100%; }
.brand-mark img{ width:100%; height:100%; object-fit:cover; border-radius:8px; }
.brand-name{ font-family: var(--font-serif); font-size:19px; font-weight:700; letter-spacing:0.2px; color:#fff; }
.brand-sub{ font-size:10.5px; color: var(--text-on-ink-muted); letter-spacing:0.6px; text-transform:uppercase; margin-top:-2px; display:block; }

.side-nav{ flex:1; overflow-y:auto; padding-bottom: 10px; }
.side-nav::-webkit-scrollbar{ width:0; }
.nav-group{ margin-bottom: 6px; }
.nav-group-label{
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-on-ink-muted); font-weight:600;
  padding: 14px 12px 6px 12px;
}
.nav-item{
  width:100%; display:flex; align-items:center; gap:11px;
  background:transparent; border:none; color: var(--text-on-ink-muted);
  padding: 9px 12px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight:500; text-align:left; cursor:pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  position: relative;
}
.nav-item svg{ width:17px; height:17px; flex:0 0 17px; opacity:0.85; }
.nav-item:hover{ background: rgba(255,255,255,0.06); color: #fff; }
.nav-item:active{ transform: scale(0.98); }
.nav-item.active{ background: rgba(196,132,42,0.16); color:#fff; }
.nav-item.active svg{ opacity:1; color: var(--amber-500); }
.nav-item .nav-dot{
  position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:4px; height:0; background:var(--amber-500); border-radius:4px;
  transition: height var(--dur-med) var(--ease);
}
.nav-item.active .nav-dot{ height: 60%; }
.nav-item:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline: 2px solid var(--amber-500); outline-offset: 2px;
}

.sidebar-footer{ padding-top:10px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-meta{ font-size:11.5px; color: var(--text-on-ink-muted); padding: 10px 10px 2px; line-height:1.5; }
.sidebar-footer{ position:relative; border-top:1px solid rgba(255,255,255,0.08); margin-top:6px; padding-top:6px; }
.account-btn{
  width:100%; display:flex; align-items:center; gap:9px; background:none; border:none; cursor:pointer;
  padding:8px 10px; border-radius:var(--radius-sm); color:#fff; text-align:left;
  transition: background var(--dur-fast) var(--ease);
}
.account-btn:hover{ background: rgba(255,255,255,0.07); }
.account-avatar{
  flex:0 0 26px; width:26px; height:26px; border-radius:50%; background: var(--amber-500); color:#241a06;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; text-transform:uppercase;
  overflow:hidden;
}
.account-info{ min-width:0; flex:1; }
.account-name{ font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.account-role{ font-size:10.5px; color: var(--text-on-ink-muted); }
.account-chevron{ flex:0 0 auto; width:14px; height:14px; color: var(--text-on-ink-muted); transition: transform var(--dur-fast) var(--ease); }
.account-btn.open .account-chevron{ transform: rotate(180deg); }
.account-menu{
  position:absolute; bottom:calc(100% + 4px); left:8px; right:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:6px; display:none; flex-direction:column; gap:2px; z-index:95;
  animation: dropIn var(--dur-fast) var(--ease);
}
.account-menu.show{ display:flex; }
.account-menu button{
  display:flex; align-items:center; gap:9px; width:100%; background:none; border:none; cursor:pointer;
  padding:9px 10px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; color: var(--text-900); text-align:left;
  transition: background var(--dur-fast) var(--ease);
}
.account-menu button:hover{ background: var(--surface-2); }

.sidebar-backdrop{
  display:none; position:fixed; inset:0; background: rgba(10,12,25,0.5);
  z-index:35; opacity:0; transition: opacity var(--dur-med) var(--ease);
}

/* ============================== MAIN COLUMN ============================== */
.main-col{ flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; }

.topbar{
  height: var(--topbar-h); flex:0 0 var(--topbar-h);
  display:flex; align-items:center; gap:14px;
  padding: 0 24px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  position:relative; z-index:20;
}
.menu-btn{
  display:none; background:none; border:none; color: var(--text-600); cursor:pointer;
  width:34px; height:34px; align-items:center; justify-content:center; border-radius:var(--radius-sm);
}
.menu-btn:hover{ background: var(--surface-2); }
.menu-btn svg{ width:20px; height:20px; }

.search-pill{
  display:flex; align-items:center; gap:9px; cursor:pointer;
  background: var(--surface-2); border:1px solid var(--border);
  padding: 8px 14px; border-radius: var(--radius-pill);
  color: var(--text-400); font-size:13px; flex:0 1 320px;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.search-pill:hover{ border-color: var(--border-strong); background: var(--surface); }
.search-pill svg{ width:15px; height:15px; flex:0 0 15px; }
.search-pill kbd{
  margin-left:auto; font-size:10.5px; background: var(--surface); border:1px solid var(--border);
  padding:1px 6px; border-radius:5px; color: var(--text-400);
}

.topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.icon-btn{
  position:relative; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  background:none; border:1px solid transparent; border-radius: var(--radius-sm); color: var(--text-600);
  cursor:pointer; transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
}
.icon-btn:hover{ background: var(--surface-2); border-color: var(--border); color: var(--text-900); }
.icon-btn svg{ width:18px; height:18px; }
.icon-btn .badge-dot{
  position:absolute; top:5px; right:6px; min-width:15px; height:15px; padding:0 4px;
  background: var(--coral-500); color:#fff; border-radius:999px;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  border: 2px solid var(--surface); transform-origin:center;
  animation: badgePop 340ms var(--ease);
}
@keyframes badgePop{ from{ transform:scale(0);} 60%{ transform:scale(1.25);} to{ transform:scale(1);} }

/* ============================== BUTTONS ============================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding: 9px 16px; border-radius: var(--radius-pill); border:1px solid transparent;
  font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast), border-color var(--dur-fast), opacity var(--dur-fast);
}
.btn svg{ width:15px; height:15px; }
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--ink-900); color:#fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover{ background: var(--ink-800); box-shadow: var(--shadow-md); }
.btn-amber{ background: var(--amber-500); color:#fff; box-shadow: var(--shadow-sm); }
.btn-amber:hover{ background: var(--amber-600); box-shadow: var(--shadow-md); }
.btn-ghost{ background: transparent; color: var(--text-600); border-color: var(--border); }
.btn-ghost:hover{ background: var(--surface-2); color: var(--text-900); border-color: var(--border-strong); }
.btn-danger{ background: var(--coral-100); color: var(--coral-500); }
.btn-danger:hover{ background: var(--coral-500); color:#fff; }
.btn-sm{ padding: 6px 12px; font-size:12.5px; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none !important; }

.chip-btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius: var(--radius-pill); border:1px solid var(--border); background: var(--surface);
  color: var(--text-600); font-size:12.5px; font-weight:600; cursor:pointer;
  transition: all var(--dur-fast) var(--ease);
}
.chip-btn:hover{ border-color: var(--border-strong); color: var(--text-900); }
.chip-btn.active{ background: var(--ink-900); border-color: var(--ink-900); color:#fff; }

/* ============================== CANVAS / PAGES ============================== */
.canvas{ flex:1; overflow-y:auto; padding: 26px 30px 60px; }
.page{ display:none; max-width: 1220px; margin: 0 auto; }
.page.active{ display:block; animation: pageIn var(--dur-med) var(--ease); }
@keyframes pageIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:translateY(0);} }

.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.page-eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.2px; color: var(--text-400); font-weight:700; margin-bottom:4px; }
.page-title{ font-size:26px; }
.page-desc{ color: var(--text-600); font-size:13.5px; margin-top:5px; max-width:520px; }
.page-actions{ display:flex; gap:9px; flex-wrap:wrap; }

.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1080px){ .grid-4{ grid-template-columns: repeat(2,1fr);} .grid-3{ grid-template-columns: repeat(2,1fr);} }
@media (max-width: 680px){ .grid-4, .grid-3, .grid-2{ grid-template-columns: 1fr; } }

.card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; box-shadow: var(--shadow-sm);
  transition: box-shadow var(--dur-med) var(--ease), transform var(--dur-med) var(--ease), border-color var(--dur-med);
}
.card.hoverable:hover{ transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.card-title{ font-family:var(--font-sans); font-size:13px; font-weight:700; color:var(--text-600); display:flex; align-items:center; gap:8px; }
.card-title svg{ width:15px; height:15px; }

/* ============================== PULSE HERO (signature) ============================== */
.pulse-hero{
  background: linear-gradient(155deg, var(--ink-900) 0%, var(--ink-800) 62%, var(--ink-700) 100%);
  border-radius: var(--radius-lg); padding: 26px 28px; color: var(--text-on-ink);
  position:relative; overflow:hidden; box-shadow: var(--shadow-lg);
}
.pulse-hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; position:relative; z-index:2; }
.pulse-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:1.2px; color: var(--text-on-ink-muted); font-weight:700; }
.pulse-balance{ font-family: var(--font-sans); font-size:46px; font-weight:700; margin-top:6px; letter-spacing:-0.5px; }
.pulse-balance sup{ font-size:20px; opacity:0.7; margin-left:2px; }
.pulse-asof{ font-size:12px; color: var(--text-on-ink-muted); margin-top:4px; }
.pulse-svg-wrap{ position:relative; height:74px; margin: 6px 0 4px; z-index:2; }
.pulse-svg-wrap svg{ width:100%; height:100%; overflow:visible; }
.pulse-line{ fill:none; stroke: var(--amber-500); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray: 900; stroke-dashoffset: 900; animation: drawPulse 1.6s var(--ease) forwards; }
@keyframes drawPulse{ to{ stroke-dashoffset:0; } }
.pulse-dot{ fill: var(--amber-500); animation: pulseGlow 2.6s ease-in-out infinite; transform-origin:center; }
@keyframes pulseGlow{ 0%,100%{ opacity:1; r:4;} 50%{ opacity:0.45; r:6.5;} }
.pulse-zero{ stroke: rgba(255,255,255,0.14); stroke-width:1; stroke-dasharray:3 4; }

.pulse-stats{ display:flex; gap:26px; flex-wrap:wrap; margin-top:18px; position:relative; z-index:2; }
.pulse-stat-label{ font-size:11px; color: var(--text-on-ink-muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:3px; }
.pulse-stat-val{ font-size:18px; font-weight:700; font-family: var(--font-sans); }
.pulse-stat-val.pos{ color:#7BE0AE; }
.pulse-stat-val.neg{ color:#F29A9A; }

/* ============================== STAT / MINI CARDS ============================== */
.stat-card{ }
.stat-value{ font-family: var(--font-sans); font-size:26px; margin-top:6px; }
.stat-value.pos{ color: var(--emerald-600); }
.stat-value.neg{ color: var(--coral-500); }
.stat-foot{ font-size:12px; color: var(--text-400); margin-top:6px; }

.mini-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); gap:10px; }
.mini-row:last-child{ border-bottom:none; }
.mini-row-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.mini-icon{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  background: var(--surface-2); color: var(--text-600); flex:0 0 34px;
}
.mini-icon svg{ width:16px; height:16px; }
.mini-name{ font-size:13px; font-weight:600; color:var(--text-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini-sub{ font-size:11.5px; color:var(--text-400); }
.mini-val{ font-size:13.5px; font-weight:700; font-family:var(--font-sans); white-space:nowrap; }

/* ============================== PROGRESS ============================== */
.progress-track{ height:9px; background: var(--surface-2); border-radius: var(--radius-pill); overflow:hidden; border:1px solid var(--border); }
.progress-fill{ height:100%; border-radius:var(--radius-pill); width:0%; transition: width 900ms var(--ease); }
.progress-fill.green{ background: var(--emerald-600); }
.progress-fill.yellow{ background: var(--amber-500); }
.progress-fill.red{ background: var(--coral-500); }
.progress-row{ margin-bottom:14px; }
.progress-row:last-child{ margin-bottom:0; }
.progress-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
.progress-top .cat{ font-weight:700; color:var(--text-900); }
.progress-top .amt{ color:var(--text-600); }

.ring-wrap{ position:relative; width:132px; height:132px; margin:0 auto; }
.ring-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); }
.ring-bg{ fill:none; stroke: var(--surface-2); stroke-width:11; }
.ring-fill{ fill:none; stroke-width:11; stroke-linecap:round; transition: stroke-dashoffset 900ms var(--ease); }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-center .big{ font-family:var(--font-sans); font-size:24px; font-weight:700; }
.ring-center .small{ font-size:10.5px; color:var(--text-400); text-transform:uppercase; letter-spacing:0.5px; }

/* ============================== BADGES / TAGS ============================== */
.tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; white-space:nowrap; }
.tag-green{ background: var(--emerald-100); color: var(--emerald-600); }
.tag-red{ background: var(--coral-100); color: var(--coral-500); }
.tag-amber{ background: var(--amber-100); color: var(--amber-600); }
.tag-violet{ background: var(--violet-100); color: var(--violet-500); }
.tag-neutral{ background: var(--surface-2); color: var(--text-600); border:1px solid var(--border); }

/* ============================== TABLE ============================== */
.table-wrap{ overflow-x:auto; border-radius: var(--radius-md); border:1px solid var(--border); }
table.data-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; background:var(--surface); }
.data-table thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-400);
  padding:11px 14px; background: var(--surface-2); border-bottom:1px solid var(--border); font-weight:700; white-space:nowrap;
}
.data-table tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tbody tr{ transition: background var(--dur-fast); }
.data-table tbody tr:last-child td{ border-bottom:none; }
.data-table tbody tr:hover{ background: var(--surface-2); }
.data-table tbody tr.flash{ animation: flashRow 1.6s var(--ease); }
@keyframes flashRow{ 0%,100%{ background:transparent;} 20%,60%{ background: var(--amber-100); } }
.row-actions{ display:flex; gap:4px; justify-content:flex-end; opacity:0.55; transition:opacity var(--dur-fast); }
.data-table tbody tr:hover .row-actions{ opacity:1; }
.mini-btn{
  width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px;
  background:none; border:none; color:var(--text-400); cursor:pointer; transition: background var(--dur-fast), color var(--dur-fast);
}

function pbkdf2JsSha256(passwordBytes, saltBytes, iterations){
  const st = hmacKeyStates(passwordBytes), inner = st.inner, outer = st.outer;

  m.set(saltBytes); m[m.length - 1] = 1;
  const u1 = sha256Resume(outer, sha256Resume(inner, m, 64), 64);
  const udv = new DataView(u1.buffer);
  const Uw = new Uint32Array(8), Tw = new Uint32Array(8), H = new Uint32Array(8), W = new Uint32Array(64);
  for(let i=0;i<8;i++){ Uw[i] = udv.getUint32(i*4, false); Tw[i] = Uw[i]; }
  for(let it=1; it<iterations; it++){
    H.set(inner);
    for(let i=0;i<8;i++) W[i] = Uw[i];
    W[8] = 0x80000000; for(let i=9;i<15;i++) W[i] = 0; W[15] = 768;
    sha256Block(H, W);
    for(let i=0;i<8;i++) W[i] = H[i];
    W[8] = 0x80000000; for(let i=9;i<15;i++) W[i] = 0; W[15] = 768;
    H.set(outer);
    sha256Block(H, W);
    for(let i=0;i<8;i++){ Uw[i] = H[i]; Tw[i] ^= H[i]; }

function utf8Bytes(s){
  s = String(s == null ? '' : s);

  const bin = unescape(encodeURIComponent(s));
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToHex(u8){ let s = ''; for(let i=0;i<u8.length;i++) s += (u8[i] < 16 ? '0' : '') + u8[i].toString(16); return s; }

  const a = new Uint8Array(16);
  const cr = (typeof window !== 'undefined') ? window.crypto : null;
  if(cr && cr.getRandomValues) cr.getRandomValues(a); else for(let i=0;i<16;i++) a[i] = Math.floor(Math.random() * 256);

async function hashPassword(password, saltHex, iterations){
  iterations = iterations || AUTH_ITERATIONS;
  const pw = utf8Bytes(password), salt = hexToBytes(saltHex);
  const cr = (typeof window !== 'undefined') ? window.crypto : null;
  if(cr && cr.subtle && cr.subtle.importKey){
    try{
      const key = await cr.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveBits']);
      const bits = await cr.subtle.deriveBits({ name:'PBKDF2', salt: salt, iterations: iterations, hash:'SHA-256' }, key, 256);
      return bytesToHex(new Uint8Array(bits));
    }catch(e){ /* fall back to the pure-JS implementation below */ }
  }
  return bytesToHex(pbkdf2JsSha256(pw, salt, iterations));
}

function currentLocale(){ const l = currentLang(); return l==='km' ? 'km-KH' : l==='zh' ? 'zh-CN' : 'en-US'; }
function t(key){
  const entry = STRINGS[key];
  if(!entry) return key;
  const l = currentLang();
  return entry[l] || entry.en || key;
}
function tf(key, vars){
  let s = t(key);
  if(vars) Object.keys(vars).forEach(k => { s = s.split('{'+k+'}').join(String(vars[k])); });
  return s;
}
function tc(value){
  if(value === undefined || value === null || value === '') return value;
  const entry = CAT_STRINGS[value];
  if(!entry) return value;
  const l = currentLang();
  return entry[l] || entry.en || value;
}

  if(!LANGS.includes(code)) return;
  state.settings.lang = code;
  persistState();
  document.documentElement.setAttribute('lang', code==='km'?'km':code==='zh'?'zh-CN':'en');

  renderCurrentPage();
  translateStaticChrome();

}
function renderAccountControl(){
  const nameEl = document.getElementById('accountNameText');
  const roleEl = document.getElementById('accountRoleText');
  const avatarEl = document.getElementById('accountAvatar');
  if(!nameEl || !roleEl || !avatarEl) return;
  let display = '', role = '';
  if(accessLevel === 'owner'){
    display = (state.settings.security.owner && state.settings.security.owner.username) || '';
    role = t('acc_owner_tag');
  } else {
    const u = (typeof currentSecurityUser === 'function') ? currentSecurityUser() : null;
    if(u){ display = u.name || u.username || ''; role = (u.name && u.username) ? '@'+u.username : ''; }
  }
  nameEl.textContent = display;
  roleEl.textContent = role;
  const pic = (typeof currentIdentityProfilePic === 'function') ? currentIdentityProfilePic() : '';

function renderAccountMenu(){
  const menu = document.getElementById('accountMenu');
  if(!menu) return;
  menu.innerHTML = `
    <button onclick="openEditProfilePic();">${icon('image',15)} ${t('pp_menu_item')}</button>
    <button onclick="toggleAccountMenu(false); lockNow();">${icon('switchUser',15)} ${t('acc_switch_user')}</button>
    <button onclick="toggleAccountMenu(false); lockNow();">${icon('logout',15)} ${t('acc_log_out')}</button>`;
}
function toggleAccountMenu(force){
  const menu = document.getElementById('accountMenu');
  const btn = document.getElementById('accountBtn');
  if(!menu) return;
  const show = force !== undefined ? force : !menu.classList.contains('show');
  if(show){ renderAccountMenu(); menu.classList.add('show'); if(btn) btn.classList.add('open'); }
  else { menu.classList.remove('show'); if(btn) btn.classList.remove('open'); }
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('accountMenu');
  const btn = document.getElementById('accountBtn');
  if(!menu || !btn) return;
  if(menu.classList.contains('show') && !menu.contains(e.target) && !btn.contains(e.target)){
    toggleAccountMenu(false);
  }
});

  gd_setup_steps:{en:'1) Create a free project at console.cloud.google.com. 2) Enable the "Google Drive API". 3) Create an OAuth Client ID (type: Web application) and add the exact web address where you host this file as an authorized origin. 4) Paste the Client ID here. This only works when the file is hosted on a real https:// address you control — it cannot work from a local file or from inside Claude.',km:'១) បង្កើតគម្រោងឥតគិតថ្លៃនៅ console.cloud.google.com ។ ២) បើកដំណើរការ "Google Drive API" ។ ៣) បង្កើត OAuth Client ID (ប្រភេទ៖ Web application) ហើយបន្ថែមអាសយដ្ឋានវេបសាយពិតប្រាកដដែលអ្នករក្សាឯកសារនេះជា authorized origin ។ ៤) បិទភ្ជាប់ Client ID នៅទីនេះ។ វាដំណើរការតែនៅពេលឯកសារនេះត្រូវបានដាក់នៅលើអាសយដ្ឋាន https:// ពិតប្រាកដដែលអ្នកគ្រប់គ្រង — វាមិនអាចដំណើរការពីឯកសារមូលដ្ឋាន ឬពីក្នុង Claude បានទេ។',zh:'1) 在 console.cloud.google.com 创建一个免费项目。2) 启用"Google Drive API"。3) 创建一个 OAuth 客户端 ID（类型：Web 应用），并将您托管此文件的确切网址添加为授权来源。4) 将客户端 ID 粘贴到此处。此功能仅在文件托管于您自己控制的真实 https:// 地址时才能使用——无法在本地文件或 Claude 内部使用。'},

function goalIcon(name){
  const n = (name||'').toLowerCase();
  if(n.includes('car')) return 'car';
  if(n.includes('house') || n.includes('home')) return 'home';
  if(n.includes('vacation') || n.includes('travel') || n.includes('trip')) return 'plane';
  if(n.includes('emergency')) return 'shield';
  if(n.includes('educat') || n.includes('school') || n.includes('college') || n.includes('tuition')) return 'graduation';
  if(n.includes('retire')) return 'goals';
  return 'goals';
}

/* ---------------- utils ---------------- */
function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function currentActorName(){
  if(accessLevel === 'owner') return (state.settings.security.owner && state.settings.security.owner.username) || '?';
  const u = (typeof currentSecurityUser === 'function') ? currentSecurityUser() : null;
  return u ? (u.name || u.username || '?') : '?';
}
function logActivity(actionKey, detail){
  if(!Array.isArray(state.activityLog)) state.activityLog = [];
  state.activityLog.push({ id: uid(), at: new Date().toISOString(), who: currentActorName(), level: accessLevel, action: actionKey, detail: detail || '' });
  if(state.activityLog.length > 300) state.activityLog = state.activityLog.slice(-300);
}

var autoLockTimer = null;
var AUTO_LOCK_EVENTS = ['mousedown','mousemove','keydown','touchstart','wheel'];
function resetAutoLockTimer(){
  if(autoLockTimer){ clearTimeout(autoLockTimer); autoLockTimer = null; }
  const mins = state && state.settings && state.settings.security && state.settings.security.autoLockMinutes;
  if(!mins) return;
  autoLockTimer = setTimeout(() => {
    const overlay = document.getElementById('bootOverlay');
    const appIsOpen = overlay && overlay.classList.contains('hide');
    if(appIsOpen && state.settings.security.owner){ logActivity('act_auto_lock', ''); lockNow(); }
  }, mins * 60 * 1000);
}
function initAutoLockWatcher(){
  AUTO_LOCK_EVENTS.forEach(evt => document.addEventListener(evt, resetAutoLockTimer, { passive:true }));
  resetAutoLockTimer();
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function pwField(inputHtml){
  return '<div class="pw-wrap">' + inputHtml + '<button type="button" class="pw-toggle" onclick="togglePwVisibility(this)" tabindex="-1" aria-label="'+escapeHtml(t('c_show_password'))+'">'+icon('eye',15)+'</button></div>';
}
function togglePwVisibility(btn){
  const wrap = btn.closest('.pw-wrap');
  const input = wrap && wrap.querySelector('input');
  if(!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = icon(show ? 'eyeOff' : 'eye', 15);
  btn.setAttribute('aria-label', t(show ? 'c_hide_password' : 'c_show_password'));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(currentLocale(), { month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(currentLocale(), { month:'short', day:'numeric' });
}
function monthKey(iso){ return (iso||'').slice(0,7); }
function monthLabel(key){
  const d = new Date(key+'-01T00:00:00');
  return d.toLocaleDateString(currentLocale(), { month:'short', year:'numeric' });
}
function fmtMoney(n){
  n = Number(n) || 0;
  const sym = (state && state.settings && state.settings.currencySymbol) || '$';
  const neg = n < 0; n = Math.abs(n);
  return (neg ? '-' : '') + sym + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtPct(n){ return (Math.round(n*10)/10) + '%'; }
function daysUntil(iso){
  const today = new Date(todayISO()+'T00:00:00');
  const target = new Date(iso+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function relativeDueLabel(iso){
  const d = daysUntil(iso);
  if(d < 0) return tf('rel_overdue', { n: Math.abs(d) });
  if(d === 0) return t('rel_due_today');
  if(d === 1) return t('rel_due_tomorrow');
  if(d <= 6) return tf('rel_due_in', { n:d });
  return tf('rel_due_on', { date: fmtDateShort(iso) });
}
function addPeriod(iso, freq){
  const d = new Date(iso+'T00:00:00');
  if(freq === 'Weekly') d.setDate(d.getDate()+7);
  else if(freq === 'Yearly') d.setFullYear(d.getFullYear()+1);
  else if(freq === 'Every 6 Months') d.setMonth(d.getMonth()+6);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function last6MonthKeys(){
  const out = [];
  const now = new Date(todayISO()+'T00:00:00');
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(d.toISOString().slice(0,7));
  }
  return out;
}
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), ms); };
}

/* ---------------- storage ---------------- */
async function loadState(){
  if(!hasStorage) return null;
  try{
    const raw = await storageGet(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
var gDriveAutoBackupTimer = null;
function scheduleGoogleAutoBackup(){
  if(typeof gDriveAccessToken === 'undefined' || !gDriveAccessToken) return;
  if(gDriveAutoBackupTimer) clearTimeout(gDriveAutoBackupTimer);
  gDriveAutoBackupTimer = setTimeout(() => { if(typeof backupToGoogleDrive === 'function') backupToGoogleDrive(true); }, 4000);
}
async function persistState(){
  if(typeof refreshNotifBadge === 'function') refreshNotifBadge();
  if(typeof scheduleGoogleAutoBackup === 'function') scheduleGoogleAutoBackup();
  if(!hasStorage) return false;
  try{
    const ok = await storageSet(STORAGE_KEY, JSON.stringify(state));
    if(!ok) throw new Error('no result');
    return true;
  }catch(e){
    console.error('Cashline: save failed', e);
    toast('error', t('c_save_failed'));
    return false;
  }
}

<script>
/* ============================================================
   CASHLINE — UI ENGINE: toasts, modal system, shared helpers
   ============================================================ */

/* ---------------- toasts ---------------- */
function toast(kind, message){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const iconName = kind === 'success' ? 'check' : kind === 'error' ? 'alertTriangle' : 'info';
  el.innerHTML = '<span class="toast-icon">'+icon(iconName,18)+'</span><span>'+escapeHtml(message)+'</span>';
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 320);
  }, 3200);
}

/* ---------------- modal core ---------------- */
let modalCloseTimer = null;
function openModalRaw(html, extraClass){
  if(modalCloseTimer){ clearTimeout(modalCloseTimer); modalCloseTimer = null; }
  document.getElementById('modalRoot').className = 'modal' + (extraClass ? ' '+extraClass : '');
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
  if(modalCloseTimer) clearTimeout(modalCloseTimer);
  modalCloseTimer = setTimeout(() => { document.getElementById('modalRoot').innerHTML = ''; modalCloseTimer = null; }, 200);
}
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if(e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(document.getElementById('modalBackdrop').classList.contains('show')) closeModal();
    if(document.getElementById('notifPanel').classList.contains('show')) toggleNotifPanel(false);
  }
});

function openConfirm({ title, message, confirmLabel, danger, onConfirm }){
  const html = `
    <div class="modal-head">
      <div><h3 class="modal-title">${escapeHtml(title)}</h3></div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">${icon('x',15)}</button>
    </div>
    <div class="modal-body"><p class="text-muted" style="font-size:13.5px;">${escapeHtml(message)}</p></div>
    <div class="form-footer">
      <button class="btn btn-ghost" onclick="closeModal()">${t('c_cancel')}</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirmActionBtn">${escapeHtml(confirmLabel || t('c_confirm'))}</button>
    </div>`;
  openModalRaw(html, 'confirm');
  document.getElementById('confirmActionBtn').onclick = () => { closeModal(); onConfirm(); };
}

/* ---------------- generic field-driven form modal ---------------- */
function renderFieldControl(f, val){
  let control = '';
  if(f.type === 'select'){
    const opts = f.options || [];
    control = `<select id="f_${f.name}">` + opts.map(o => {
      const v = (o && typeof o === 'object') ? o.value : o;
      const l = (o && typeof o === 'object') ? o.label : o;
      return `<option value="${escapeHtml(v)}" ${String(v)===String(val)?'selected':''}>${escapeHtml(l)}</option>`;
    }).join('') + `</select>`;
  } else if(f.type === 'textarea'){
    control = `<textarea id="f_${f.name}" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(val)}</textarea>`;
  } else if(f.type === 'checkbox'){
    control = `<div class="check-row"><input type="checkbox" id="f_${f.name}" ${val?'checked':''}/><label for="f_${f.name}" style="margin:0;">${escapeHtml(f.checkboxLabel||'')}</label></div>`;
  } else {
    const t = f.type || 'text';
    const step = t === 'number' ? `step="${f.step||'0.01'}"` : '';
    const min = f.min !== undefined ? `min="${f.min}"` : '';
    control = `<input type="${t}" id="f_${f.name}" value="${escapeHtml(val)}" placeholder="${escapeHtml(f.placeholder||'')}" ${step} ${min} autocomplete="off"/>`;
  }
  const hint = f.hint ? `<div class="field-hint">${escapeHtml(f.hint)}</div>` : '';
  if(f.type === 'checkbox') return `<div class="field">${control}${hint}</div>`;
  const req = f.required ? '<span style="color:var(--coral-500)"> *</span>' : '';
  return `<div class="field"><label for="f_${f.name}">${escapeHtml(f.label)}${req}</label>${control}${hint}</div>`;
}

function openFormModal({ title, subtitle, fields, submitLabel, wide, initial, onSubmit }){
  const values = initial || {};
  const getVal = (f) => values[f.name] !== undefined ? values[f.name] : (f.default !== undefined ? f.default : '');

  let html = '';
  for(let i=0;i<fields.length;i++){
    const f = fields[i];
    if(f.type === 'section'){ html += `<div class="field-group-title">${escapeHtml(f.label)}</div>`; continue; }
    if(f.half){
      const next = fields[i+1] && fields[i+1].half ? fields[i+1] : null;
      html += '<div class="form-row">' + renderFieldControl(f, getVal(f));
      if(next){ html += renderFieldControl(next, getVal(next)); i++; }
      html += '</div>';
      continue;
    }
    html += renderFieldControl(f, getVal(f));
  }

  const modalHtml = `
    <div class="modal-head">
      <div>
        <h3 class="modal-title">${escapeHtml(title)}</h3>
        ${subtitle ? `<p class="modal-sub">${escapeHtml(subtitle)}</p>` : ''}
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">${icon('x',15)}</button>
    </div>
    <div class="modal-body" id="modalFormBody">${html}</div>
    <div class="form-footer">
      <button class="btn btn-ghost" onclick="closeModal()">${t('c_cancel')}</button>
      <button class="btn btn-amber" id="modalSubmitBtn">${escapeHtml(submitLabel || t('c_save'))}</button>
    </div>`;
  openModalRaw(modalHtml, wide ? 'wide' : '');

  // wire dependent (category -> subcategory) selects
  fields.forEach(f => {
    if(f.dependsOn){
      const parentEl = document.getElementById('f_'+f.dependsOn);
      const childEl = document.getElementById('f_'+f.name);
      if(parentEl && childEl){
        const initialVal = getVal(f);
        const update = (keepInitial) => {
          const opts = f.optionsFor(parentEl.value) || [];
          childEl.innerHTML = opts.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
          if(keepInitial && opts.includes(initialVal)) childEl.value = initialVal;
        };
        parentEl.addEventListener('change', () => update(false));
        update(true);
      }
    }
  });

  document.getElementById('modalSubmitBtn').onclick = () => {
    const out = {};
    let valid = true, firstInvalid = null;
    fields.forEach(f => {
      if(f.type === 'section') return;
      const el = document.getElementById('f_'+f.name);
      if(!el) return;
      let v = f.type === 'checkbox' ? el.checked : el.value;
      if(f.type === 'number') v = (v === '' ? null : parseFloat(v));
      if(f.required && (v === '' || v === null || v === undefined || (typeof v === 'number' && isNaN(v)))){
        valid = false; el.style.borderColor = 'var(--coral-500)';
        if(!firstInvalid) firstInvalid = el;
      } else {
        el.style.borderColor = '';
      }
      out[f.name] = v;
    });
    if(!valid){ if(firstInvalid) firstInvalid.focus(); toast('error', t('c_required_hint')); return; }
    onSubmit(out);
  };

  setTimeout(() => {
    const first = document.querySelector('#modalFormBody input, #modalFormBody select, #modalFormBody textarea');
    if(first) first.focus();
  }, 60);
}

/* ---------------- notification panel toggle ---------------- */
function toggleNotifPanel(force){
  const panel = document.getElementById('notifPanel');
  const show = force !== undefined ? force : !panel.classList.contains('show');
  if(show){
    if(typeof renderNotifPanel === 'function') renderNotifPanel();
    panel.classList.add('show');
  } else {
    panel.classList.remove('show');
  }
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('notifPanel');
  const btn = document.getElementById('notifBtn');
  if(panel.classList.contains('show') && !panel.contains(e.target) && !btn.contains(e.target)){
    toggleNotifPanel(false);
  }
});

/* ---------------- language switcher ---------------- */
function renderLangFlag(){
  const el = document.getElementById('langFlagCurrent');
  if(el) el.innerHTML = flagIcon(currentLang(), 22, 22);
}
function renderLangPanel(){
  const panel = document.getElementById('langPanel');
  if(!panel) return;
  panel.innerHTML = LANGS.map(code => `<button class="lang-option ${currentLang()===code?'active':''}" onclick="setLang('${code}')" aria-label="${code}">${flagIcon(code,28,28)}</button>`).join('');
}
function toggleLangPanel(force){
  const panel = document.getElementById('langPanel');
  if(!panel) return;
  const show = force !== undefined ? force : !panel.classList.contains('show');
  if(show){ renderLangPanel(); panel.classList.add('show'); }
  else { panel.classList.remove('show'); }
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('langPanel');
  const btn = document.getElementById('langBtn');
  if(!panel || !btn) return;
  if(panel.classList.contains('show') && !panel.contains(e.target) && !btn.contains(e.target)){
    toggleLangPanel(false);
  }
});

/* ---------------- shared page-render helpers ---------------- */
function pageHeader(key, actionsHtml){
  const meta = NAV_ITEMS.find(n => n.key === key);
  return `<div class="page-head">
    <div>
      <div class="page-eyebrow">${escapeHtml(t(meta.group))}</div>
      <h1 class="page-title">${escapeHtml(t(meta.labelKey))}</h1>
      <p class="page-desc">${escapeHtml(t(meta.descKey))}</p>
    </div>
    <div class="page-actions">${actionsHtml || ''}</div>
  </div>`;
}
function emptyState(iconName, title, desc, actionLabel, actionOnclick){
  return `<div class="empty-state">${icon(iconName,40)}<h4>${escapeHtml(title)}</h4><p>${escapeHtml(desc)}</p>${actionLabel ? `<button class="btn btn-amber btn-sm" onclick="${actionOnclick}">${escapeHtml(actionLabel)}</button>` : ''}</div>`;
}
function budgetStatus(pct){
  if(pct > 100) return 'red';
  if(pct >= 80) return 'yellow';
  return 'green';
}
function animateCountUp(el, target, isMoney, duration){
  duration = duration || 800;
  const start = 0;
  const t0 = performance.now();
  function step(now){
    const p = clamp((now - t0) / duration, 0, 1);
    const eased = 1 - Math.pow(1-p, 3);
    const val = start + (target - start) * eased;
    el.textContent = isMoney ? fmtMoney(val) : Math.round(val).toLocaleString();
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
</script>
<script>
/* ============================================================
   CASHLINE — COMPUTED HELPERS
   ============================================================ */
function getAccount(id){ return state.accounts.find(a => a.id === id); }
function currentMonthKey(){ return monthKey(todayISO()); }
function sumTx(list){ return list.reduce((s,t) => s + t.amount, 0); }
function txForMonth(key, type){ return state.transactions.filter(tx => monthKey(tx.date) === key && (!type || tx.type === type)); }
function khrRate(){ return (state.settings && state.settings.khrPerUsd) || 4100; }
function khrToUsd(khr){ return (Number(khr)||0) / khrRate(); }
function usdToKhr(usd){ return (Number(usd)||0) * khrRate(); }
function fmtKHR(n){ n = Math.round(Number(n)||0); return '៛' + n.toLocaleString('en-US'); }
function accountBalanceTotal(excludeCreditCard){
  return state.accounts.filter(a => !excludeCreditCard || a.type !== 'Credit Card')
    .reduce((s,a) => s + a.balance + khrToUsd(a.balanceKHR), 0);
}
function getMonthSummary(key){
  const inc = sumTx(txForMonth(key,'income'));
  const exp = sumTx(txForMonth(key,'expense'));
  return { income: inc, expenses: exp, net: inc - exp };
}
function budgetActualForCategory(cat, key){
  return sumTx(state.transactions.filter(tx => tx.type === 'expense' && tx.category === cat && monthKey(tx.date) === (key || currentMonthKey())));
}
function computeBudgetRows(key){
  return state.budgets.map(b => {
    const actual = budgetActualForCategory(b.category, key);
    const pct = b.amount > 0 ? (actual / b.amount * 100) : 0;
    return Object.assign({}, b, { actual, pct, status: budgetStatus(pct) });
  });
}
function netWorthBreakdown(){
  const cashLike = state.accounts.filter(a => a.type !== 'Credit Card').reduce((s,a) => s + a.balance + khrToUsd(a.balanceKHR), 0);
  const ccDebt = state.accounts.filter(a => a.type === 'Credit Card').reduce((s,a) => s + a.balance, 0);
  const invValue = state.investments.reduce((s,i) => s + i.currentValue, 0);
  const assetsValue = state.assets.reduce((s,a) => s + a.value, 0);
  const lentOut = (state.lendings||[]).reduce((s,l) => s + l.remainingBalance, 0);
  const debtsTotal = state.debts.reduce((s,d) => s + d.remainingBalance, 0);
  const assetsTotal = cashLike + invValue + assetsValue + lentOut;
  const liabilitiesTotal = ccDebt + debtsTotal;
  return { cashLike, invValue, assetsValue, lentOut, assetsTotal, ccDebt, debtsTotal, liabilitiesTotal, netWorth: assetsTotal - liabilitiesTotal };
}
function emergencyFundGoal(){ return state.goals.find(g => g.name.toLowerCase().includes('emergency')); }
function upcomingRecurring(type, days){
  days = days === undefined ? 400 : days;
  return state.recurring.filter(r => (!type || r.type === type) && daysUntil(r.nextDate) <= days)
    .slice().sort((a,b) => a.nextDate.localeCompare(b.nextDate));
}
function last14DaysDailyNet(){
  const out = [];
  const today = new Date(todayISO()+'T00:00:00');
  for(let i=13;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const inc = sumTx(state.transactions.filter(tx => tx.date === iso && tx.type === 'income'));
    const exp = sumTx(state.transactions.filter(tx => tx.date === iso && tx.type === 'expense'));
    out.push({ date: iso, net: inc - exp });
  }
  return out;
}
function buildSparkline(values, w, h, padY){
  padY = padY === undefined ? 6 : padY;
  const n = values.length;
  if(n === 0) return { path:'', zeroY: h/2, points: [] };
  const max = Math.max(...values, 0), min = Math.min(...values, 0);
  const range = (max - min) || 1;
  const stepX = n > 1 ? w/(n-1) : 0;
  const toY = (v) => h - padY - ((v - min)/range) * (h - padY*2);
  const points = values.map((v,i) => ({ x: i*stepX, y: toY(v) }));
  const path = points.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  return { path, zeroY: toY(0), points };
}

        ` : `<p class="text-muted" style="margin-top:10px;">${t('d_no_ef')}</p><button class="link-btn" style="margin-top:8px;" onclick="openAddGoal()">${t('d_set_one_up')}</button>`}
      </div>

            <circle class="ring-bg" cx="66" cy="66" r="${R}"/>

      </div>

  `;
  const heroEl = document.getElementById('heroBalance');
  if(heroEl) animateCountUp(heroEl, currentBalance, true, 900);
}

/* ============================================================
   RENDER: INCOME + EXPENSES (shared transaction list)
   ============================================================ */
var txFilters = { income: { q:'', category:'', from:'', to:'' }, expense: { q:'', category:'', from:'', to:'' } };

function filteredTransactions(type){
  const f = txFilters[type];
  return state.transactions.filter(tx => {
    if(tx.type !== type) return false;
    if(f.category && tx.category !== f.category) return false;
    if(f.from && tx.date < f.from) return false;
    if(f.to && tx.date > f.to) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (tx.merchant+' '+tx.category+' '+(tx.subcategory||'')+' '+(tx.notes||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));
}
function clearTxFilters(type){ txFilters[type] = { q:'', category:'', from:'', to:'' }; renderTransactionsPage(type); }

/* ============================================================
   BULK ACTIONS on the Income / Expenses tables
   ============================================================ */
var txSelection = { income: new Set(), expense: new Set() };
function txPageKey(type){ return type === 'income' ? 'income' : 'expenses'; }
function txCanEdit(type){ return pageIsEditableForViewer(txPageKey(type)); }
function updateBulkBar(type){
  const n = txSelection[type].size;
  const bar = document.getElementById('bulkbar_' + type);
  if(bar){
    bar.style.display = n ? 'flex' : 'none';
    const c = document.getElementById('bulkcount_' + type);
    if(c) c.textContent = tf('bulk_selected', { n });
  }
  const all = document.getElementById('txselall_' + type);
  if(all){
    const total = document.querySelectorAll('#page-' + txPageKey(type) + ' .txsel').length;
    all.checked = total > 0 && n === total;
    all.indeterminate = n > 0 && n < total;
  }
}
function toggleTxSelection(type, id, on){
  if(on) txSelection[type].add(id); else txSelection[type].delete(id);
  const row = document.getElementById('tx-' + id);
  if(row) row.classList.toggle('tx-selected', !!on);
  updateBulkBar(type);
}
function toggleTxSelectAll(type, on){
  document.querySelectorAll('#page-' + txPageKey(type) + ' .txsel').forEach(cb => {
    cb.checked = !!on;
    if(on) txSelection[type].add(cb.dataset.id); else txSelection[type].delete(cb.dataset.id);
    const row = document.getElementById('tx-' + cb.dataset.id);
    if(row) row.classList.toggle('tx-selected', !!on);
  });
  updateBulkBar(type);
}
function clearTxSelection(type){
  txSelection[type].clear();
  toggleTxSelectAll(type, false);
}
/* everything a transaction did to the books, undone: the account balance and any linked loan / lending balance */
function reverseTransactionEffects(tx){
  applyTransactionToAccount(tx, -1);
  if(tx.linkedDebtId){
    const d = state.debts.find(x => x.id === tx.linkedDebtId);
    if(d) d.remainingBalance = Math.min(d.originalAmount, d.remainingBalance + tx.amount);
  }
  if(tx.linkedLendingId){
    const l = state.lendings.find(x => x.id === tx.linkedLendingId);
    if(l) l.remainingBalance = Math.min(l.originalAmount, l.remainingBalance + tx.amount);
  }
}
function openBulkRecategorize(type){
  const ids = [...txSelection[type]];
  const n = ids.length;
  if(!n) return;
  const cats = type === 'income' ? INCOME_CATEGORIES : Object.keys(EXPENSE_CATEGORIES);
  const keep = '<option value="">' + escapeHtml(t('bulk_keep')) + '</option>';
  openModalRaw(`
    <div class="modal-head"><div><h3 class="modal-title">${tf('bulk_recat_title', { n })}</h3></div><button class="modal-close" onclick="closeModal()" aria-label="Close">${icon('x',15)}</button></div>
    <div class="modal-body">
      <div class="field"><label for="bkCat">${t('bulk_recat_category')}</label><select id="bkCat">${keep}${cats.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(tc(c)) + '</option>').join('')}</select></div>
      ${type === 'expense' ? `
        <div class="field" id="bkSubWrap" style="display:none;"><label for="bkSub">${t('bulk_recat_subcategory')}</label><select id="bkSub"></select></div>
        <div class="field"><label for="bkNW">${t('tx_col_needwant')}</label><select id="bkNW">${keep}${NEED_WANT.map(v => '<option value="' + v + '">' + escapeHtml(tc(v)) + '</option>').join('')}</select></div>` : ''}
    </div>
    <div class="form-footer">
      <button class="btn btn-ghost" onclick="closeModal()">${t('c_cancel')}</button>
      <button class="btn btn-amber" id="bkApplyBtn" disabled>${tf('bulk_recat_apply', { n })}</button>
    </div>`);
  const catEl = document.getElementById('bkCat'), subEl = document.getElementById('bkSub'), subWrap = document.getElementById('bkSubWrap');
  const nwEl = document.getElementById('bkNW'), btn = document.getElementById('bkApplyBtn');
  const refresh = () => {
    if(type === 'expense'){
      const c = catEl.value;
      if(c){
        subWrap.style.display = '';
        if(subEl.dataset.forCat !== c){
          subEl.innerHTML = EXPENSE_CATEGORIES[c].map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(tc(s)) + '</option>').join('');
          subEl.dataset.forCat = c;
        }
      } else subWrap.style.display = 'none';
    }
    btn.disabled = !(catEl.value || (nwEl && nwEl.value));
  };
  catEl.onchange = refresh;
  if(nwEl) nwEl.onchange = refresh;
  btn.onclick = async () => {
    if(btn.disabled) return;
    btn.disabled = true;
    const idSet = new Set(ids);
    const cat = catEl.value, sub = (type === 'expense' && cat) ? subEl.value : '', nw = nwEl ? nwEl.value : '';
    let changed = 0;
    state.transactions.forEach(tx => {
      if(!idSet.has(tx.id) || tx.type !== type) return;
      if(cat){ tx.category = cat; tx.subcategory = type === 'expense' ? sub : ''; }
      if(nw && type === 'expense') tx.needWant = nw;
      changed++;
    });
    txSelection[type].clear();
    logActivity('act_bulk_recategorize', String(changed));
    await persistState();
    closeModal();
    renderCurrentPage();
    toast('success', tf('bulk_recat_done', { n: changed }));
  };
}
function confirmBulkDelete(type){
  const ids = new Set(txSelection[type]);
  const list = state.transactions.filter(tx => ids.has(tx.id) && tx.type === type);
  if(!list.length) return;
  const total = list.reduce((s, tx) => s + tx.amount, 0);
  const linked = list.filter(tx => tx.linkedDebtId || tx.linkedLendingId).length;
  openConfirm({
    title: t('bulk_delete_title'),
    message: tf('bulk_delete_msg', { n: list.length, total: fmtMoney(total) }) + (linked ? ' ' + tf('bulk_delete_linked', { k: linked }) : ''),
    confirmLabel: t('c_delete'), danger: true,
    onConfirm: async () => {
      list.forEach(tx => reverseTransactionEffects(tx));
      const gone = new Set(list.map(tx => tx.id));
      state.transactions = state.transactions.filter(tx => !gone.has(tx.id));
      txSelection[type].clear();
      logActivity('act_bulk_delete', String(list.length));
      await persistState();
      renderSidebar();
      renderCurrentPage();
      toast('success', tf('bulk_deleted', { n: list.length }));
    }
  });
}

function renderTransactionsPage(type){
  const rows = filteredTransactions(type);

  const total = sumTx(rows);

  const canEdit = txCanEdit(type);
  const selSet = txSelection[type];
  { const vis = new Set(rows.map(r => r.id)); [...selSet].forEach(id => { if(!canEdit || !vis.has(id)) selSet.delete(id); }); }   // the selection only ever holds rows that are visible and editable
  const iconName = type === 'income' ? 'income' : 'expenses';

    <button class="btn btn-ghost btn-sm" onclick="exportTransactionsCSV('${type}')">${icon('download',14)} ${t('c_export_csv')}</button>

  const filterBar = `
    <div class="filter-bar">

      <select id="txcat_${type}"><option value="">${escapeHtml(t('tx_all_categories'))}</option>${cats.map(c => `<option value="${escapeHtml(c)}" ${txFilters[type].category===c?'selected':''}>${escapeHtml(tc(c))}</option>`).join('')}</select>
      <input type="date" id="txfrom_${type}" value="${txFilters[type].from}" title="${escapeHtml(t('f_date'))}"/>
      <input type="date" id="txto_${type}" value="${txFilters[type].to}" title="${escapeHtml(t('f_date'))}"/>
      ${hasFilters ? `<button class="chip-btn" onclick="clearTxFilters('${type}')">${icon('x',12)} ${t('tx_clear_filters')}</button>` : ''}
    </div>`;

  const tableHtml = rows.length ? `

              <td><div class="row-actions">
                <button class="mini-btn" onclick="openEditTransaction('${t2.id}')" aria-label="Edit">${icon('edit',14)}</button>

          }).join('')}

  document.getElementById('page-'+pageKey).innerHTML = `
    ${pageHeader(pageKey, actions)}
    <div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div><span class="text-muted">${type==='income'?t('tx_total_received'):t('tx_total_spent')}</span><div class="stat-value ${type==='income'?'pos':'neg'} tnum" style="font-size:22px;">${fmtMoney(total)}</div></div>
      <div class="text-muted">${rows.length} ${t('tx_count')}</div>
    </div>
    ${filterBar}
    ${canEdit && rows.length ? `<div class="bulk-bar" id="bulkbar_${type}" style="display:none;">
      <span class="bulk-count" id="bulkcount_${type}"></span>
      <button class="btn btn-ghost btn-sm" onclick="openBulkRecategorize('${type}')">${icon('edit',13)} ${t('bulk_change_category')}</button>

      <button class="chip-btn" onclick="clearTxSelection('${type}')">${icon('x',12)} ${t('bulk_clear')}</button>
    </div>` : ''}
    ${tableHtml}
  `;

  const qEl = document.getElementById('txq_'+type);
  if(qEl) qEl.oninput = debounce(() => { txFilters[type].q = qEl.value; renderTransactionsPage(type); }, 250);
  const catEl = document.getElementById('txcat_'+type);
  if(catEl) catEl.onchange = (e) => { txFilters[type].category = e.target.value; renderTransactionsPage(type); };
  const fromEl = document.getElementById('txfrom_'+type);
  if(fromEl) fromEl.onchange = (e) => { txFilters[type].from = e.target.value; renderTransactionsPage(type); };
  const toEl = document.getElementById('txto_'+type);
  if(toEl) toEl.onchange = (e) => { txFilters[type].to = e.target.value; renderTransactionsPage(type); };


  if(canEdit){
    document.querySelectorAll('#page-' + pageKey + ' .txsel').forEach(cb => { cb.onchange = () => toggleTxSelection(type, cb.dataset.id, cb.checked); });

    if(allEl) allEl.onchange = () => toggleTxSelectAll(type, allEl.checked);
    updateBulkBar(type);
  }
  if(lastSearchHighlight && rows.some(r => r.id === lastSearchHighlight)){
    const rowEl = document.getElementById('tx-'+lastSearchHighlight);
    if(rowEl){

      setTimeout(() => rowEl.classList.remove('flash'), 1700);
    }
    lastSearchHighlight = null;
  }
}

function renderExpenses(){ renderTransactionsPage('expense'); }

/* ============================================================
   RENDER: RECURRING
   ============================================================ */
function renderRecurring(){
  const rows = state.recurring.slice().sort((a,b) => a.nextDate.localeCompare(b.nextDate));
  const actions = `<button class="btn btn-amber" onclick="openAddRecurring()">${icon('plus',14)} ${t('rc_add')}</button>`;

  const tableHtml = rows.length ? `

        <tr>
          <td><strong>${escapeHtml(r.name)}</strong></td>

  document.getElementById('page-recurring').innerHTML = `${pageHeader('recurring', actions)}${tableHtml}`;

/* ============================================================
   RENDER: BILLS
   ============================================================ */
function renderBills(){
  const bills = state.recurring.filter(r => r.type === 'expense').slice().sort((a,b) => a.nextDate.localeCompare(b.nextDate));

  const cardsHtml = bills.length ? `<div class="grid grid-3">` + bills.map(b => {
    const d = daysUntil(b.nextDate);
    const urgent = d <= 3;
    return `<div class="card hoverable">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div class="mini-icon" style="background:${urgent?'var(--coral-100)':'var(--surface-2)'}; color:${urgent?'var(--coral-500)':'var(--text-600)'};">${icon('bills',16)}</div>
        <span class="tag ${d<0?'tag-red':d<=3?'tag-amber':'tag-neutral'}">${relativeDueLabel(b.nextDate)}</span>
      </div>
      <div style="font-weight:700; font-size:15px; margin-top:12px;">${escapeHtml(b.name)}</div>
      <div class="text-muted">${escapeHtml(b.category.split(' / ').map(tc).join(' / '))} · ${escapeHtml(tc(b.frequency))}</div>
      <div class="stat-value tnum" style="margin-top:8px; font-size:21px;">${fmtMoney(b.amount)}</div>
      <button class="btn btn-primary btn-sm btn-block" style="margin-top:12px;" onclick="markBillPaid('${b.id}')">${t('bl_mark_paid')}</button>
    </div>`;
  }).join('') + `</div>` : emptyState('bills', t('bl_all_clear'), t('bl_all_clear_d'), t('bl_go_recurring'), "navigate('recurring')");

  document.getElementById('page-bills').innerHTML = `${pageHeader('bills','')}${cardsHtml}`;
}

/* ---------------- recurring / bills quick actions ---------------- */
function postRecurringNow(id){
  const r = state.recurring.find(x => x.id === id);
  if(!r) return;
  const parts = (r.category||'').split(' / ');
  const tx = {
    id: uid(), date: todayISO(), type: r.type, category: parts[0] || r.category, subcategory: parts[1] || '',
    merchant: r.name, amount: r.amount, accountId: r.accountId, recurring: r.frequency, notes:'', receipt:'',
    paymentMethod: r.type === 'expense' ? 'Recurring' : undefined,
    needWant: r.type === 'expense' ? 'Need' : undefined
  };
  applyTransactionToAccount(tx, 1);
  state.transactions.push(tx);
  r.nextDate = addPeriod(r.nextDate, r.frequency);
  persistState();
  renderRecurring();
  if(currentPage === 'bills') renderBills();
  toast('success', tf('ts_recurring_posted', { name: r.name, date: fmtDateShort(r.nextDate) }));
}
function markBillPaid(id){
  postRecurringNow(id);
  renderBills();
}

/* ============================================================
   RENDER: NET WORTH
   ============================================================ */
function getNetWorthSeries(){
  const hist = state.netWorthHistory.slice();
  const curKey = currentMonthKey();
  const live = netWorthBreakdown().netWorth;
  const idx = hist.findIndex(h => h.month === curKey);
  if(idx >= 0) hist[idx] = { month:curKey, value:live }; else hist.push({ month:curKey, value:live });
  return hist.slice(-6);
}
function ensureNetWorthSnapshot(){
  const curKey = currentMonthKey();
  if(!state.netWorthHistory.some(h => h.month === curKey)){
    state.netWorthHistory.push({ month:curKey, value: netWorthBreakdown().netWorth });
    if(state.netWorthHistory.length > 24) state.netWorthHistory = state.netWorthHistory.slice(-24);
  }
}

function estimatePayoffMonths(balance, annualRatePct, monthlyPayment){
  const r = (annualRatePct/100)/12;
  let b = balance, months = 0;
  while(b > 0 && months < 600){
    const interest = b*r;
    if(monthlyPayment <= interest) return null;
    b = b + interest - monthlyPayment;
    months++;
  }
  return months >= 600 ? null : months;
}
function estimatePayoffDate(debt){
  const months = estimatePayoffMonths(debt.remainingBalance, debt.interestRate, debt.monthlyPayment);
  if(months === null) return null;
  const d = new Date(todayISO()+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}

function openMakePayment(debtId){
  const d = state.debts.find(x => x.id === debtId);
  if(!d) return;
  openFormModal({
    title: t('db_make_payment'),
    subtitle: tf('db_recorded_as_expense', { name: d.name }),
    submitLabel: t('db_payment'),
    fields: [
      { name:'amount', label:t('f_amount'), type:'number', required:true, default:d.monthlyPayment, half:true },
      { name:'date', label:t('f_date'), type:'date', default:todayISO(), required:true, half:true },
      { name:'accountId', label:t('f_pay_from'), type:'select', required:true, options: state.accounts.map(a => ({value:a.id, label:a.name})), default: getAccount(d.accountId) ? d.accountId : (state.accounts[0]||{}).id },
    ],
    onSubmit: (vals) => {
      const amt = vals.amount;
      d.remainingBalance = Math.max(0, d.remainingBalance - amt);
      const tx = { id:uid(), date:vals.date, type:'expense', category:'Financial', subcategory:'Loan', merchant:d.name+' Payment', amount:amt, accountId:vals.accountId, recurring:'No', needWant:'Need', paymentMethod:'Bank Transfer', notes:'', receipt:'', linkedDebtId:d.id };
      applyTransactionToAccount(tx, 1);
      state.transactions.push(tx);
      persistState();
      openDebtDetail(d.id);
      renderDebts();
      if(currentPage === 'expenses') renderExpenses();
      if(currentPage === 'budget') renderBudget();
      toast('success', tf('ts_payment_recorded', { name: d.name }));
    }
  });
}

          <button class="mini-btn" onclick="openEditInvestment('${i.id}')" aria-label="Edit">${icon('edit',14)}</button>
          <button class="mini-btn danger" onclick="confirmDeleteInvestment('${i.id}')" aria-label="Delete">${icon('trash',14)}</button>
        </div>

        <div><div class="text-muted" style="font-size:11px;">${t('iv_value')}</div><div class="tnum" style="font-weight:700;">${fmtMoney(i.currentValue)}</div></div>
        <div><div class="text-muted" style="font-size:11px;">${t('iv_return')}</div><div class="tnum" style="font-weight:700; color:${pl>=0?'var(--emerald-600)':'var(--coral-500)'};">${pl>=0?'+':''}${fmtPct(ret)}</div></div>
      </div>
    </div>`;
  }).join('') + `</div>` : emptyState('investments', t('iv_no_inv'), t('iv_no_inv_d'), t('iv_add'), 'openAddInvestment()');

  document.getElementById('page-investments').innerHTML = `
    ${pageHeader('investments', actions)}
    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="card"><div class="card-title">${t('iv_total_cost')}</div><div class="stat-value tnum">${fmtMoney(totalCost)}</div></div>
      <div class="card"><div class="card-title">${t('iv_current_value')}</div><div class="stat-value tnum">${fmtMoney(totalValue)}</div></div>
      <div class="card"><div class="card-title">${t('iv_profit_loss')}</div><div class="stat-value ${totalPL>=0?'pos':'neg'} tnum">${totalPL>=0?'+':''}${fmtMoney(totalPL)}</div></div>
    </div>
    ${rows.length ? `<div class="card" style="margin-bottom:18px;"><div class="section-title">${t('iv_allocation')}</div><div class="chart-box"><canvas id="chartAllocation"></canvas></div></div>` : ''}
    ${cardsHtml}
  `;
  if(rows.length) renderAllocationChart(rows);
}
</script>
<script>
/* ============================================================
   RENDER: GOALS

      </div>
      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px;" onclick="openAddFunds('goal','${g.id}')">${icon('plus',13)} ${t('gl_add_funds')}</button>

  document.getElementById('page-goals').innerHTML = `${pageHeader('goals', actions)}${cardsHtml}`;
}

/* ============================================================
   RENDER: SAVINGS CHALLENGES
   ============================================================ */
function renderChallenges(){
  const rows = state.challenges;
  const actions = `<button class="btn btn-amber" onclick="openAddChallenge()">${icon('plus',14)} ${t('ch_add')}</button>`;
  const typeLabel = { '52-week':t('ch_type_52week'), 'no-spend':t('ch_type_nospend'), 'custom':t('ch_type_custom') };

  const cardsHtml = rows.length ? `<div class="grid grid-3">` + rows.map(c => {
    const pct = clamp(c.target > 0 ? c.saved/c.target*100 : 0, 0, 100);
    const done = c.saved >= c.target;

      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div class="mini-icon avatar-color-2">${icon('challenges',17)}</div>
        <div style="display:flex; gap:2px;">
          <button class="mini-btn" onclick="openEditChallenge('${c.id}')" aria-label="Edit">${icon('edit',14)}</button>
          <button class="mini-btn danger" onclick="confirmDeleteChallenge('${c.id}')" aria-label="Delete">${icon('trash',14)}</button>
        </div>
      </div>
      <div style="font-weight:700; font-size:15.5px; margin-top:12px; display:flex; align-items:center; gap:6px;">${escapeHtml(c.name)} ${done?`<span style="color:var(--emerald-600);">${icon('check',15)}</span>`:''}</div>

      <div class="progress-track" style="margin-top:12px;"><div class="progress-fill ${done?'green':'yellow'}" style="width:${pct}%"></div></div>
      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <span class="tnum" style="font-weight:700;">${fmtMoney(c.saved)}</span>
        <span class="text-muted tnum">${tf('gl_of_target', { target: fmtMoney(c.target), pct: Math.round(pct) })}</span>

      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px;" onclick="openAddFunds('challenge','${c.id}')">${icon('plus',13)} ${t('gl_add_funds')}</button>
    </div>`;
  }).join('') + `</div>` : emptyState('challenges', t('ch_no_chal'), t('ch_no_chal_d'), t('ch_add'), 'openAddChallenge()');

function openAddFunds(kind, id){
  const list = kind === 'goal' ? state.goals : state.challenges;
  const item = list.find(x => x.id === id);
  if(!item) return;
  openFormModal({
    title: t('gl_add_funds') + ' — ' + item.name,
    submitLabel: t('gl_add_funds'),
    fields: [ { name:'amount', label:t('f_amount'), type:'number', required:true } ],
    onSubmit: (vals) => {
      item.saved = (item.saved || 0) + vals.amount;
      persistState();
      closeModal();
      if(kind === 'goal') renderGoals(); else renderChallenges();

      toast('success', reached ? tf('ts_goal_reached', { name: item.name }) : tf('ts_funds_added', { amount: fmtMoney(vals.amount), name: item.name }));

}

   RENDER: REPORTS

      <div class="card"><div class="section-title">${t('rp_income_vs_exp')} <span class="text-muted" style="font-weight:500;">${t('cf_last6')}</span></div><div class="chart-box"><canvas id="chartIncomeExpense"></canvas></div></div>
